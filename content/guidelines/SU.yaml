schema_version: 1.0.0
category:
  id: SU
  title: SU. Sufficiency, uncertainty, and pitfall rules
  index_title: SU. Sufficiency, uncertainty, and pitfall guidance
  description: null
guidelines:
- id: SU.1
  category: SU
  title: Identify and address plausible challenges to claims, reasoning, and evidence
  statement: Where a reviewer could reasonably question whether a claim, reasoning step, evidence item, assumption, or stated scope is valid, complete, applicable, or sufficiently reliable, make that challenge explicit and address it where needed.
  rationale: A credible safety case should not only present supporting material. It should also make important doubts visible and show how they are handled. This fits well with GSN-style review, where challenge is used to test whether a claim, inference, or supporting material still stands when subjected to scrutiny.
  review_prompts:
  - What could invalidate this claim or reasoning step?
  - What assumptions, confounders, uncertainties, or biases are relevant here?
  - Could this evidence be incomplete, misleading, or outside the supported scope?
  - Is the challenge really against the claim, the reasoning, the evidence, an assumption, or the stated scope?
  - Are important doubts visible in the argument, or left unstated?
  examples:
    bad: |-
      Claim: Hazard analysis is complete for the defined ODD.
      Evidence: Hazard analysis report HAR-03.
    problem: A reviewer could reasonably ask whether the analysis covered scenarios introduced after the most recent ODD revision, whether the chosen method has known coverage limits for emergent multi-actor interactions, and whether the ODD assumptions still hold. None of these challenges are visible in the argument.
    good: |-
      Claim: Hazard analysis is complete for the defined ODD.
      Evidence: Hazard analysis report HAR-03.
      Challenge: The analysis may not cover scenarios introduced after the most recent ODD revision.
      Response: Change-impact review CIR-12 confirms newly added scenarios were re-examined.
      Challenge: The chosen method has known coverage limits for emergent multi-actor interactions.
      Response: Supplementary scenario-based analysis SBA-04 addresses that gap.
  references:
  - source_id: CAE-Review
  - source_id: CAE-Defeaters
  - source_id: RA1205
  - source_id: UL4600
    clauses:
    - 5.3.2.2(a)
    - 5.4.2.2(b)
  - source_id: GSN-v3
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Strategy
    - GSN Solution
    detection_hints:
    - Look for branches presenting only supporting material with no challenges or responses.
    suggested_checks:
    - id: check-plausible-challenges-addressed
      description: Check whether plausible reviewer challenges to the claim, reasoning, or evidence are visible and addressed.
- id: SU.2
  category: SU
  title: Make assumptions explicit and justify why they are reasonable
  statement: Do not rely on hidden assumptions. State assumptions explicitly, explain why they are reasonable, and ensure they are monitored or otherwise controlled where needed.
  rationale: Unstated or weakly founded assumptions are a common cause of later argument invalidation. That aligns well with UL 4600’s treatment of assumptions and lifecycle monitoring. GSN also treats assumptions as a distinct element type, so checking whether something is really an assumption is appropriate.
  review_prompts:
  - What must be true for this branch to hold?
  - Why is this assumption reasonable, and how would we know if it became false?
  - Is this really an assumption, or should it instead be represented as context, a claim, or evidence?
  examples:
    bad: |-
      Claim: Localization accuracy is acceptable within the defined ODD.
      Hidden assumption (not stated): Map data used at runtime is current.
    problem: A reviewer cannot judge whether the assumption is reasonable, whether it is monitored, or what would invalidate it. If the assumption fails, the affected claim may silently lose support.
    good: |-
      Claim: Localization accuracy is acceptable within the defined ODD.
      Assumption: Map data used at runtime is no more than 7 days out of date.
      Justification: Map update process MAP-PROC-02 enforces a 7-day refresh cycle and is monitored by KPI MAP-KPI-01.
      Re-assessment trigger: Sustained KPI breach or change to the map update process.
  references:
  - source_id: UL4600
    clauses:
    - 5.4.1.3(a)(11)
    - 5.4.2.2(a)(3)
    - 5.4.1.6.2
  - source_id: GSN-v3
    clauses:
    - '0:4.6'
    - 1:2.2.17
  tool:
    applicable_elements:
    - GSN Assumption
    detection_hints:
    - Look for branches whose validity depends on a condition that is not stated as an assumption or context.
    suggested_checks:
    - id: check-explicit-assumptions
      description: Check whether implicit assumptions are made explicit, justified, and monitorable.
- id: SU.3
  category: SU
  title: Do not rely on uncorroborated expert judgment alone
  statement: Do not rely on expert judgment alone unless its basis, limits, and corroborating support are stated, or the residual uncertainty is monitored over the lifecycle where appropriate.
  rationale: Expert opinion may be useful, but unsupported opinion is weak support and can easily outstate what is actually known.
  review_prompts:
  - Is the opinion supported by data, literature, documented analysis, or another explicit technical basis?
  - Is the context of applicability clear and argued?
  - If the opinion remains weakly supported, is lifecycle monitoring in place where needed?
  examples:
    bad: |-
      Claim: Residual risk is acceptable.
      Evidence: Safety review board statement that residual risk is considered acceptable.
    problem: Expert judgment is being used as the sole basis for the claim, with no analysis, data, or independent corroboration that a reviewer can examine.
    good: |-
      Claim: Residual risk is acceptable.
      Evidence:
      - Quantitative risk analysis QRA-09 showing residual risk below the defined threshold.
      - Operational data summary ODS-03 covering 18 months of comparable exposure with no injury-class events.
      Expert review: Safety review board record SRB-2026-04 confirming the analysis method, inputs, and conclusion are consistent with established practice.
      Note: Expert review is corroborating, not substituting for, the underlying analysis and data.
  references:
  - source_id: UL4600
    clauses:
    - 5.4.2.2(a)(1)
    - 5.4.2.6.3
  - source_id: AVSC-CSE
    clauses:
    - 6.1-6.3
  tool:
    applicable_elements:
    - GSN Solution
    - GSN Justification
    detection_hints:
    - Look for evidence consisting only of expert statements without supporting analysis or data.
    suggested_checks:
    - id: check-expert-judgment-corroboration
      description: Check whether expert judgment is corroborated by data, analysis, or lifecycle monitoring.
- id: SU.4
  category: SU
  title: Monitor claims that cannot be fully supported at design time
  statement: When a claim cannot be fully supported at design time, make the remaining uncertainty explicit and define lifecycle monitoring that can confirm or challenge the claim during operation.
  rationale: Some claims depend partly on assumptions, limited evidence, or expected field behavior. In such cases, the safety case should not hide the remaining uncertainty. It should explain it and define how operation will provide feedback.
  review_prompts:
  - What part of this claim is not fully supported at design time?
  - Can that remaining uncertainty only be reduced through operational or field data?
  - Is lifecycle monitoring defined for that uncertainty?
  - Are reassessment triggers identified?
  examples:
    bad: |-
      Claim: Unexpected roadside object class X is sufficiently rare that residual risk is acceptable.
      Evidence: Design-time analysis suggesting object class X is rare.
      Justification: The design-time rarity assumption is treated as fully proven; no operational follow-up is defined.
    problem: The available data does not fully establish the operational frequency of object class X, but the remaining uncertainty is not made explicit and no lifecycle monitoring is defined to confirm or challenge the claim during operation.
    good: |-
      Claim: Unexpected roadside object class X is sufficiently rare that residual risk is acceptable.
      Acknowledged uncertainty: The rarity assumption is not fully confirmed at design time.
      Field monitoring: Occurrence of roadside object class X is monitored in operation.
      Reassessment trigger: Observed frequency or associated incidents exceed threshold T.
  references:
  - source_id: ISO-21448
    clauses:
    - 12.3-12.4
    - 13.1-13.4
  - source_id: UL4600
    clauses:
    - 5.4.2.2(a)
    - 5.4.2.3(c)
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Assumption
    detection_hints:
    - Look for claims with partial design-time support and no defined lifecycle monitoring.
    suggested_checks:
    - id: check-lifecycle-monitoring
      description: Check whether claims with residual design-time uncertainty have defined monitoring and reassessment triggers.
- id: SU.5
  category: SU
  title: Do not reuse safety credit from another context without showing it still applies
  statement: Do not rely on safety credit from proven-in-use technology, legacy technology, COTS, prior assessments, standard conformance, or prior practice unless you show that the original context is sufficiently comparable to the current one.
  rationale: Safety confidence gained in one context does not automatically remain valid in another. Differences in operating environment, purpose, interfaces, duty cycle, autonomy role, or assumptions can invalidate the reuse.
  review_prompts:
  - What safety confidence, evidence, or assessment result is being reused from another context?
  - Is the original operating context sufficiently comparable to the current one?
  - Have differences in purpose, environment, interfaces, or assumptions been identified?
  - Have the limitations of the original assessment been stated?
  examples:
    bad: This camera is proven in use and is therefore acceptable for autonomous truck operation.
    problem: The claim takes safety credit from another context (passenger vehicle ADAS use) without showing that the original application, operating conditions, interfaces, and safety role are sufficiently comparable to autonomous heavy truck operation.
    good: |-
      Claim: Reuse of camera safety credit is justified for the current application.
      Context:
      - Original application: conventional passenger vehicle ADAS use.
      - Current application: autonomous heavy truck operation.
      Justification: Safety credit may only be reused if the original and current contexts are shown to be sufficiently comparable in the aspects that matter to safety.
      Sub-claims:
      - The original and current operating environments are sufficiently comparable.
      - The original and current duty cycles are sufficiently comparable.
      - The original and current interfaces and installation conditions are sufficiently comparable.
      - The original and current safety roles and failure consequences are sufficiently comparable.
      - Any non-comparable differences are addressed by additional evidence or explicit limitations.
  references:
  - source_id: UL4600
    clauses:
    - 5.3.3.2(c)
    - 5.3.2.2(b)-(c)
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Justification
    detection_hints:
    - Look for proven-in-use or legacy claims with no comparability argument.
    suggested_checks:
    - id: check-context-comparability
      description: Check whether reused safety credit is supported by an explicit comparability argument.
- id: SU.6
  category: SU
  title: Do not dismiss operational feedback because it is non-reproducible or non-injury
  statement: When a claim relies on operational experience, field monitoring, incident history, or proven-in-use style reasoning, do not dismiss incidents, near misses, anomalies, or failure reports merely because they have not recurred, cannot yet be reproduced, or did not lead to harm.
  rationale: Operational feedback is often used to support claims about residual risk, rarity, adequacy of existing controls, or continued acceptability in service. In those branches, non-injury or non-reproducibility does not make a signal irrelevant. Several weak signals together may show that the argument is less reliable than it appears.
  review_prompts:
  - Is this branch relying on operational experience or field feedback as part of its support?
  - Are incidents defined broadly enough to include near misses, close calls, and anomalies that could have led to harm?
  - Is adverse operational feedback being screened out too aggressively?
  - Is the argument considering the combined signal from multiple incidents or anomalies?
  - Is adverse operational evidence explicitly recorded, evaluated, and addressed?
  examples:
    bad: |-
      Claim: Residual risk from unexpected roadside object encounters is acceptable in operation.
      Support: field incident history and operational monitoring.
      Note: Three roadside-object anomalies were reported, but none caused injury and none could be reproduced, so they are not safety-relevant.
    problem: The argument uses operational feedback but dismisses adverse signals simply because they were non-injury and non-reproducible; together they may indicate the rarity assumption is less reliable than it appears.
    good: |-
      Claim: Residual risk from unexpected roadside object encounters is acceptable in operation.
      Support: field incident history and operational monitoring.
      Treatment: The three anomalies are recorded, grouped, and evaluated as negative field feedback. The argument explains whether they challenge the rarity assumption, whether they show a gap in object coverage, and whether more analysis or mitigation is needed.
  references:
  - source_id: RA1205
  - source_id: ONR-SAPs
  - source_id: UL4600
    clauses:
    - 5.3.3.2(d)
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Solution
    detection_hints:
    - Look for arguments that use operational data and discount non-injury or non-reproducible incidents.
    suggested_checks:
    - id: check-operational-feedback-treatment
      description: Check whether adverse operational feedback is recorded, grouped, and evaluated rather than silently dismissed.
- id: SU.7
  category: SU
  title: Do not argue low risk from operational experience or unvalidated simulation alone
  statement: Do not infer low risk for a known hazard solely from uneventful operational history or from simulation whose credibility for the claim has not been demonstrated.
  rationale: Operational exposure can miss catastrophic but rare outcomes. Simulation can miss modeling defects and abstraction errors.
  review_prompts:
  - Is simulation alone being treated as enough to show low risk?
  - Is operational history alone being treated as enough to show low risk?
  - Has simulation validity for this claim not been shown?
  - Are corroborating evidence, scenario limits, or model limitations missing?
  examples:
    bad: |-
      Claim: Collision risk with cut-in vehicles is low.
      Evidence: Simulation results SIM-12.
      Justification: No collisions were observed in the simulation results, therefore the risk is low.
    problem: The branch treats simulation results alone as sufficient proof that risk is low, without showing that the simulation is valid for this claim, that the modeled scenarios are adequate, or that important model limitations are understood.
    good: |-
      Claim: Collision risk with cut-in vehicles is acceptably low.
      Evidence:
      - Simulation results SIM-12.
      - Track test report TR-08.
      - Field incident review FR-03.
      Argument: Why SIM-12 is valid for this hazard and what scenario space it covers; what limitations remain in the simulation model; how TR-08 corroborates important behaviors in representative test conditions; how FR-03 is used to check whether operational experience challenges the claim.
  references:
  - source_id: UNECE-ADS
  - source_id: ISO-21448
  - source_id: UL4600
    clauses:
    - 5.3.3.2(i)-(j)
    - 5.4.2.1(c)
  tool:
    applicable_elements:
    - GSN Solution
    - GSN Justification
    detection_hints:
    - Look for low-risk claims supported only by simulation or only by uneventful operational time.
    suggested_checks:
    - id: check-low-risk-evidence-mix
      description: Check whether low-risk claims combine multiple corroborating evidence types and address simulation validity.
- id: SU.8
  category: SU
  title: Do not assume human data or human-designed tests cover autonomy-specific failures
  statement: Do not assume that human-operated data sets or human-designed test plans are sufficient to cover autonomy-specific failures or edge cases.
  rationale: Autonomous systems can encounter operating situations and failure combinations that are uncommon in human driving. Human-derived data and human-designed tests may therefore miss important autonomy-specific risks.
  review_prompts:
  - Is the claim supported mainly by human-operated data or human-designed tests?
  - Could the autonomous system encounter situations or create hazards that are uncommon in human driving?
  - Are autonomy-specific failure modes and edge cases explicitly considered?
  - Is there evidence that the test basis covers autonomy-specific failures, not only human-driving situations?
  examples:
    bad: |-
      Claim: Planning failure modes are adequately covered by the test set.
      Evidence: Scenario Selection Report SSR-04.
      Justification: The scenario set is based on human-driven fleet data and therefore covers relevant road situations.
    problem: The branch assumes that human-driven data is enough to cover planning failures, but the autonomous planner may enter unusual states or produce behaviors that human drivers would not normally create.
    good: |-
      Claim: Planning failure modes are adequately covered by the test set.
      Evidence:
      - Scenario Selection Report SSR-04.
      - Planner Failure Analysis Report PFA-03.
      - Edge Case Test Specification ETS-07.
      Justification: Coverage is based not only on human-driven scenarios, but also on autonomy-specific planner failure analysis and identified edge cases.
  references:
  - source_id: ISO-21448
    clauses:
    - 7.1-7.4
    - 9.1-9.3
    - 10-11
  - source_id: UL4600
    clauses:
    - 5.3.3.2(e)
    - 5.3.3.2(g)
    - 5.4.2.2(b)
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Solution
    detection_hints:
    - Look for claims about autonomy coverage backed only by human-driven datasets or human-designed scenarios.
    suggested_checks:
    - id: check-autonomy-coverage
      description: Check whether the test basis covers autonomy-specific failure modes and edge cases.
- id: SU.9
  category: SU
  title: Document unstated assumptions at the point of use
  statement: When a claim or reasoning step depends on something that is not currently stated, make that dependency explicit at the point where it constrains the argument, using an assumption, context element, or subclaim as appropriate.
  rationale: Hidden dependencies are a common reason for late argument invalidation. Making them visible helps the reviewer see what the branch depends on and decide whether that dependency should remain an assumption, be stated as context, or be argued as a claim.
  review_prompts:
  - What must be true for this claim or strategy to hold, but is not currently stated?
  - Is the hidden dependency local to the claim, or to the reasoning step?
  - Should this dependency be represented as an assumption, as context, or as a claim that must be proved?
  examples:
    bad: 'Claim: Localization integrity is sufficient for safe fallback.'
    problem: The branch depends on an unstated condition about localization performance during fallback (that integrity remains within bound L1), but that dependency is only implicit and a reviewer cannot see what must hold for the claim to be valid.
    good: |-
      Claim: Localization integrity is sufficient for safe fallback.
      Assumption: Localization integrity remains within bound L1 during fallback maneuver.

      Or, if that dependency should be argued rather than assumed:

      Claim: Localization integrity is sufficient for safe fallback.
      Sub-claim: Localization integrity remains within bound L1 during fallback maneuver.
      Evidence: Fallback localization analysis report FLA-03.
  references:
  - source_id: UL4600
    clauses:
    - 5.4.1.3(a)(11)
    - 5.4.1.6.2
    - 5.4.2.2(a)(3)
  - source_id: GSN-v3
    clauses:
    - '0:4.6'
    - 1:2.2.12
    - 1:2.2.17
  tool:
    applicable_elements:
    - GSN Assumption
    - GSN Context
    - GSN Goal
    detection_hints:
    - Look for claims whose validity depends on conditions not stated as assumption, context, or subclaim.
    suggested_checks:
    - id: check-unstated-dependencies
      description: Check whether unstated dependencies are made visible at the point of use.
- id: SU.10
  category: SU
  title: Keep assumptions bounded, specific, and monitorable
  statement: Do not use assumptions that are broader than the claim scope or so vague that they cannot be checked, challenged, or monitored.
  rationale: Over-broad assumptions can make a claim appear closed while removing most of its review value. If an argument depends on an assumption, the assumption should be narrow enough to understand, evaluate, and monitor where needed.
  review_prompts:
  - Is the assumption matched to the scope of the claim it constrains?
  - Can the assumption be checked, challenged, or monitored?
  - Does the assumption hide several different dependencies that should be separated?
  - Would the branch become clearer if the assumption were narrowed or split?
  examples:
    bad: |-
      Claim: Traffic signal interpretation is sufficiently reliable for safe intersection handling.
      Assumption: Infrastructure behaves correctly.
    problem: The assumption is too broad; it does not identify which infrastructure, which behaviors, which authorities, or what kinds of failure are being assumed away, so it cannot be checked, challenged, or monitored.
    good: |-
      Claim: Traffic signal interpretation is sufficiently reliable for safe intersection handling.
      Assumption: Within the defined ODD, traffic signals managed by the identified road authorities are assumed to conform to the referenced control standard.
      Monitoring: Violations are tracked through field feedback and incident analysis.

      Or, if several dependencies are involved, split into multiple assumptions:
      - Traffic signal installations in the defined ODD conform to the referenced control standard.
      - Detected traffic signal anomalies are captured through field feedback.
  references:
  - source_id: UL4600
    clauses:
    - 5.4.2.2(a)(3)
    - 10.5.1.2(b),(h)
    - 12.5.1.2(c)(1)
    - 12.5.2.2(b)
  - source_id: GSN-v3
    clauses:
    - 1:2.2.12
    - 1:2.2.17
  tool:
    applicable_elements:
    - GSN Assumption
    detection_hints:
    - Look for assumptions that are vague, universal, or unmonitorable.
    suggested_checks:
    - id: check-assumption-bounded
      description: Check whether each assumption is narrow, specific, and monitorable where needed.
- id: SU.11
  category: SU
  title: Make plausible reviewer challenges explicit and resolve them
  statement: When review raises a plausible What if X? challenge, make that challenge explicit and resolve it visibly in the safety case. Depending on the method, this may be represented as a GSN Counter Claim, a CAE defeater, or another explicit challenge element. The resolution may reject the challenge, narrow or revise the original claim, add supporting evidence, introduce assumptions and monitoring, or leave a visible open issue if the matter is not yet resolved.
  rationale: A credible safety case should not leave plausible challenges only in review comments or reviewer intuition. Good reviews expose weaknesses early. Making the challenge explicit helps ensure that it is either resolved properly or left visible until it is resolved.
  review_prompts:
  - What exactly is the reviewer challenge?
  - Should this challenge be made explicit as a Counter Claim, defeater, or other challenge element?
  - Has the challenge been rejected, sustained, or left unresolved?
  - If sustained, has the original branch been updated appropriately?
  - If unresolved, is the open issue visible and traceable?
  examples:
    bad: |-
      Initial branch:
      Claim: Fallback behavior is acceptably safe.
      Reviewer challenge raised informally: What if localization drops out during fallback?
      The challenge is not promoted into the safety case and remains in review notes only.
    problem: A plausible reviewer challenge has been left in review comments and reviewer intuition rather than made explicit in the safety case, so it cannot be tracked, resolved, or shown as an open issue.
    good: |-
      Make the challenge explicit:
      Challenge: Fallback behavior may not be acceptably safe if localization drops out during fallback.
      Representation: In GSN this may be shown as a Counter Claim; in CAE this may be shown as a defeater.
      Status: Undeveloped (while analysis is ongoing).

      Possible resolutions:
      - Challenge rejected: Add evidence (Fallback localization analysis FLA-04, Fallback test report FTR-09); claim retained.
      - Challenge sustained: Narrow the claim to "Fallback behavior is acceptably safe under conditions with validated localization continuity."
      - Challenge partly sustained: Add dependency "Localization continuity is maintained during fallback" plus monitoring of continuity violations.
      - Not yet resolved: Open Issue "Impact of localization dropout during fallback remains unresolved and requires additional analysis."
  references:
  - source_id: CAE-Review
  - source_id: CAE-Defeaters
  - source_id: RA1205
  - source_id: UL4600
    clauses:
    - 5.3.2.2(a)
    - 5.3.2.3(c)(1)-(2)
    - 5.4.2.2(b)
    - 5.4.2.3(a)
  - source_id: GSN-v3
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Counter Claim
    - CAE Claim
    - CAE Defeater
    detection_hints:
    - Look for plausible reviewer challenges that have not been promoted into the safety case.
    suggested_checks:
    - id: check-counter-claims-resolved
      description: Check whether plausible reviewer challenges are made explicit and visibly resolved.

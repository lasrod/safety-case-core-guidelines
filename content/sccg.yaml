schema_version: 3.1.0
sccg_version: 0.8.1
document:
  title: Safety Case Core Guidelines
  copyright: © 2026 Jesper Brännström
  license:
    id: CC-BY-4.0
    name: Creative Commons Attribution 4.0 International License
    url: https://creativecommons.org/licenses/by/4.0/
  purpose: |-
    This document consolidates review guidance for safety cases into one
    guideline-based review framework that can be cited during reviews.
source_policy:
  summary: |-
    These guidelines draw on several source classes. The wording in this
    document is intended to paraphrase source material and established
    practice rather than reproduce source text.
method_application_guidance:
  summary: SCCG guidelines should be interpreted as notation-neutral quality expectations where possible. When a development process uses a specific assurance-case notation or method, apply the guideline through the corresponding notation elements and make any method-specific interpretation explicit in the guideline text, example, or tool guidance.
  recommendations:
  - method: GSN-based development
    recommendation: Apply the full SCCG set. Interpret claims as GSN goals, inference or decomposition steps as strategies, context as GSN context, assumptions as GSN assumptions, and evidence as GSN solutions.
  - method: CAE-based development
    recommendation: Apply the full SCCG set, but interpret GSN-oriented terms through CAE concepts. Interpret claims as CAE claims, inference or decomposition steps as CAE arguments or warrants, and evidence as CAE evidence or supporting information.
  - method: SACM or tool-neutral interchange
    recommendation: Apply the notation-neutral guideline text first. Use tool guidance only as mapping guidance into the tool's specific element model. Map the tool's own element types onto the notation-neutral element_role values published with the selectable elements, and present SCCG element names in the notation the user sees.
id_scheme:
- prefix: CL
  meaning: Claim guidance
- prefix: AR
  meaning: Argument structure and decomposition guidance
- prefix: EV
  meaning: Evidence guidance
- prefix: SU
  meaning: Sufficiency, uncertainty, and pitfall guidance
- prefix: LF
  meaning: Logical fallacy guidance
- prefix: RD
  meaning: Rhetorical device guidance
required_guideline_sections:
- Guideline
- Why
- Review prompts
- Example
- References
retired_guidelines:
- id: AR.3
  title: Use context and assumptions deliberately
  retired_in: 0.8.0
  replaced_by:
  - AR.7
  - AR.6
  note: It asked for the same thing as AR.7, moving scope and dependency clauses out of claim text, and its remaining half, whether the context a claim needs is present at all, is AR.6. Cite AR.7 for placement and AR.6 for missing context.
- id: SU.9
  title: Document unstated assumptions at the point of use
  retired_in: 0.8.0
  replaced_by:
  - SU.2
  note: Merged into SU.2, which now also requires an assumption to be stated where it constrains the argument and applies to claims and context as well as assumption elements.
- id: RD.6
  title: Do not bury important limitations or hidden assumptions
  retired_in: 0.8.0
  replaced_by:
  - RD.3
  - SU.2
  note: It was the negative form of RD.3. Buried limitations are now RD.3, which keeps known limitations visible where the claim is read; hidden assumptions are SU.2.

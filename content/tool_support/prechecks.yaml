schema_version: 1.0.0
prechecks:
- id: check-explicit-strategy
  display_name: Goal has children but no explicit strategy
  related_guideline_ids:
  - AR.2
  expected_data:
  - SEL
  - CHILDREN
  - STRATEGY
  result_type: boolean_candidate
  description: Detects candidate cases where a claim is decomposed without an explicit reasoning step.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-trace
  display_name: No evidence path
  related_guideline_ids:
  - EV.1
  expected_data:
  - SEL
  - EVIDENCE_PATH
  result_type: boolean_candidate
  description: Detects candidate cases where a claim has no path to evidence and is not intentionally undeveloped.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-citation-precision
  display_name: Evidence reference too broad
  related_guideline_ids:
  - EV.4
  expected_data:
  - EVIDENCE_ITEM
  result_type: boolean_candidate
  description: Detects candidate cases where a solution cites a broad artifact without precise location.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-control-attributes
  display_name: Evidence missing control attributes
  related_guideline_ids:
  - EV.7
  expected_data:
  - EVIDENCE_ITEM
  result_type: missing_fields
  description: Detects evidence references without useful control attributes such as owner, version, status, date, or location.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-state-fixed
  display_name: Live mutable evidence reference
  related_guideline_ids:
  - EV.8
  expected_data:
  - EVIDENCE_ITEM
  result_type: boolean_candidate
  description: Detects evidence references that appear to point to mutable live documents without a fixed version.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.

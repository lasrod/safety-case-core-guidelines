schema_version: 2.0.0
prechecks:
- id: check-explicit-strategy
  display_name: Claim has children but no explicit reasoning step
  related_guideline_ids:
  - AR.2
  expected_data:
  - SELECTED_CLAIM
  - CHILDREN
  - STRATEGY
  result_type: boolean_candidate
  description: Detects candidate cases where a claim is decomposed without an explicit reasoning step.
  fires_when: The selected claim has at least one supporting child element and no strategy or reasoning element between the claim and those children. It does not fire on a strategy that has no children; that is a different defect and is not this pre-check.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-trace
  display_name: Claim has no evidence path
  related_guideline_ids:
  - EV.1
  expected_data:
  - SELECTED_CLAIM
  - EVIDENCE_PATH
  result_type: boolean_candidate
  description: Detects candidate cases where a claim has no path to evidence and is not intentionally undeveloped.
  fires_when: No descendant of the selected claim is an evidence element, and the claim is not marked undeveloped.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-citation-precision
  display_name: Evidence reference too broad
  related_guideline_ids:
  - EV.4
  expected_data:
  - SELECTED_EVIDENCE
  - EVIDENCE_ITEM
  result_type: boolean_candidate
  description: Detects candidate cases where an evidence element cites a broad artifact without a precise location.
  fires_when: The selected evidence element names an artifact but neither its text nor the evidence item's cited_section identifies a section, clause, table, figure, dataset, or test identifier within it.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-control-attributes
  display_name: Evidence missing control attributes
  related_guideline_ids:
  - EV.7
  expected_data:
  - SELECTED_EVIDENCE
  - EVIDENCE_ITEM
  result_type: missing_fields
  description: Detects evidence references without useful control attributes such as owner, version, status, date, or location.
  fires_when: The evidence item carries none of owner, version, status, date, or location, and no such attribute is stated in the selected evidence element's text. The result names which of those fields are missing.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-state-fixed
  display_name: Live mutable evidence reference
  related_guideline_ids:
  - EV.8
  expected_data:
  - SELECTED_EVIDENCE
  - EVIDENCE_ITEM
  result_type: boolean_candidate
  description: Detects evidence references that appear to point to mutable live documents without a fixed version.
  fires_when: The evidence reference carries a mutable-source marker (see the EV.8 markers) and carries no fixing marker such as a revision, version, snapshot, or capture date.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.

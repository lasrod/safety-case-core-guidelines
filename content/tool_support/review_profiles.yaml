  - PARENT
  - CHILDREN
  - STRATEGY
  - DIRECT_CONTEXT
  - INHERITED_CONTEXT
  optional_data:
  - EVIDENCE_PATH
  - PROJECT_GLOSSARY
- id: strategy_review

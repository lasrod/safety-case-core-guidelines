schema_version: 1.0.0
review_profiles:
- id: claim_wording_review
  display_name: Claim wording review
  description: Reviews whether a selected claim is clear, falsifiable, bounded, and not overloaded.
  applies_to:
  - GSN Goal
  - SACM Claim
  - CAE Claim
  guideline_ids:
  - CL.1
  - CL.2
  - CL.3
  - CL.4
  - CL.5
  - CL.6
  - RD.4
  - LF.6
  required_data:
  - SEL
  - DIRECT_CONTEXT
  optional_data:
  - PARENT
  - CHILDREN
  - INHERITED_CONTEXT
  - PROJECT_GLOSSARY
- id: claim_context_review
  display_name: Claim context review
  description: Reviews whether the selected claim has enough context, scope, assumptions, and definitions.
  applies_to:
  - GSN Goal
  - SACM Claim
  - CAE Claim
  guideline_ids:
  - CL.4
  - CL.5
  - AR.3
  - SU.2
  - RD.6
  required_data:
  - SEL
  - DIRECT_CONTEXT
  - INHERITED_CONTEXT
  optional_data:
  - PARENT
  - PROJECT_GLOSSARY
  - STANDARD_LINKS
- id: decomposition_review
  display_name: Decomposition review
  description: Reviews whether the selected claim is decomposed using clear, complete, and appropriate reasoning.

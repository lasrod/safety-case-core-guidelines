- id: PARENT
  role: supporting
  display_name: Parent element
  description: The immediate parent claim, goal, strategy, or reasoning element of the selected element.
  required_fields:
  - element_id
  - element_type
  - text
  optional_fields:
  - relationship_type
  field_meanings:
    element_id: The identifier of the immediate parent of the selected element.
    element_type: The notation element type of the parent, named as in selectable_elements.
    text: The full text of the parent.
    relationship_type: The kind of link from the parent to the selected element, such as supported by or in context of.
- id: CHILDREN
  role: supporting
  display_name: Child elements
  description: Immediate supporting claims, strategies, solutions, or evidence links below the selected element.
  required_fields:
  - child_elements
  optional_fields:
  - relationship_types
  field_meanings:
    child_elements: Each element directly below the selected element in the argument, as element_id, element_type, and text.
    relationship_types: The kind of link from the selected element to each child, in the same order as child_elements.
- id: DIRECT_CONTEXT
  role: supporting
  display_name: Direct context
  description: Context, assumptions, and justifications directly attached to the selected element.
  required_fields:
  - context_elements
  - assumptions
  - justifications
  optional_fields: []
  field_meanings:
    context_elements: Each context element attached directly to the selected element, as element_id, element_type, and text.
    assumptions: Each assumption attached directly to the selected element, in the same shape.
    justifications: Each justification, warrant, or rationale element attached directly to the selected element, in the same shape.
- id: INHERITED_CONTEXT
  role: supporting
  display_name: Inherited context
  description: Context and assumptions inherited from ancestor elements.
  required_fields:
  - ancestor_context
  - ancestor_assumptions
  optional_fields: []
  field_meanings:
    ancestor_context: Each context element attached to an ancestor of the selected element, as element_id, element_type, and text, nearest ancestor first.
    ancestor_assumptions: Each assumption attached to an ancestor of the selected element, in the same shape, nearest ancestor first.
- id: STRATEGY
  role: supporting
  display_name: Connecting strategy
  description: The strategy or reasoning element connecting a parent claim to supporting claims. Distinct from SELECTED_STRATEGY, which is the strategy being reviewed.
  required_fields:
  - element_id
  - element_type
  - text
  optional_fields:
  - strategy_context
  field_meanings:
    element_id: The identifier of the strategy or reasoning element connecting the parent claim to its supporting claims.
    element_type: The notation element type of that strategy, named as in selectable_elements.
    text: The full text of that strategy.
    strategy_context: Context, assumptions, and justifications attached to that strategy, as element_id, element_type, and text.
- id: EVIDENCE_ITEM
  role: supporting
  display_name: Evidence item
  description: Control metadata for a cited evidence artifact or evidence reference.
  required_fields:
  - element_id
  - element_type
  - text
  optional_fields:
  - artifact_type
  - owner
  - version
  - status
  - date
  - location
  - cited_section
  field_meanings:
    element_id: The identifier of the evidence element that cites the artifact.
    element_type: The notation element type of that evidence element, named as in selectable_elements.
    text: The full text of that evidence element.
    artifact_type: The kind of artifact cited, such as test report, analysis, or review record.
    owner: The person or team responsible for the artifact.
    version: The version, revision, or issue of the artifact that is cited.
    status: The approval status of the cited artifact, such as draft, in review, approved, or released.
    date: The date of the cited version, such as its approval or release date.
    location: Where the cited version can be retrieved, such as a repository path or a document-control identifier.
    cited_section: The part of the artifact that carries the support, such as a section, table, figure, dataset, or test identifier.
- id: EVIDENCE_PATH
  role: supporting
  display_name: Evidence path
  description: Path from a selected claim to descendant evidence.
  required_fields:
  - path_elements
  - evidence_items
  optional_fields: []
  field_meanings:
    path_elements: The elements on the path from the selected claim down to its evidence, as element_id, element_type, and text, in order from the claim.
    evidence_items: The evidence elements the path reaches, in the same shape.
- id: EVIDENCE_BASIS
  role: supporting
  display_name: Evidence basis
  description: Information used to judge whether evidence is sufficient for the claim, rather than merely relevant to it.
  required_fields: []
  optional_fields:
  - acceptance_criteria
  - coverage
  - thresholds
  - scenario_set
  - configuration
  - limitations
  field_meanings:
    acceptance_criteria: The criteria the evidence has to meet for the claim, such as pass conditions or required results.
    coverage: What the evidence covers and what it does not, such as conditions, functions, or hazards.
    thresholds: The numeric limits the results are judged against.
    scenario_set: The scenarios, test cases, or data set the evidence was produced from, and where they came from.
    configuration: The system, software, and sensor configuration the evidence applies to.
    limitations: Known limitations, exclusions, and unfavourable results recorded for the evidence.
- id: PROJECT_GLOSSARY
  role: supporting
  display_name: Project glossary
  description: Relevant project terms and definitions.
  required_fields:
  - terms
  optional_fields: []
  field_meanings:
    terms: Each project term used in the reviewed elements, with its definition.
- id: STANDARD_LINKS
  role: supporting
  display_name: Standard links
  description: Linked external standard requirements or guidance references.
  required_fields:
  - linked_requirements
  optional_fields: []
  field_meanings:
    linked_requirements: Each external standard requirement or guidance clause linked to the reviewed elements, with its identifier and, where available, its text.
- id: CHANGE_HISTORY
  role: supporting
  display_name: Change history
  description: Relevant review comments, prior findings, proposal history, and baseline or version state.
  required_fields: []
  optional_fields:
  - review_comments
  - prior_findings
  - proposal_history
  - baseline
  field_meanings:
    review_comments: Remarks a person recorded against the reviewed elements, with author and date where known.
    prior_findings: Findings an earlier review, by a person or a tool, raised against the reviewed elements, each with its guideline id and status.
    proposal_history: Changes proposed to the reviewed elements, and whether each was accepted, rejected, or is still pending.
    baseline: The baseline, version, or snapshot of the case the elements are reviewed in, and whether they changed since the last reviewed baseline.
- id: USER_REVIEW_INTENT
  role: supporting
  display_name: User review intent
  description: A review concern or focus supplied by the user requesting the review.
  required_fields:
  - review_intent
  optional_fields: []
  field_meanings:
    review_intent: The concern or question the user asked the review to focus on, in the user's words.

schema_version: 3.1.0
availability_states:
- id: available
  display_name: Available
  meaning: The package is supplied with its required fields present, and at least one of its fields is populated. A field is populated when its value is anything other than null, an empty string, an empty list, or an empty object. The same rule applies to every package, whether or not it has required fields.
- id: not_implemented
  display_name: Not implemented
  meaning: The tool has no source for this package at all.
- id: empty
  display_name: Empty
  meaning: The tool has a source for this package and this case has nothing in it, so none of its fields is populated. That is a fact about the case, for example a claim with no children.
- id: withheld
  display_name: Withheld
  meaning: The data exists and was deliberately not shared with the review, for example by a consent or confidentiality decision.
when_unavailable: Assess every guideline of the profile against the data that was supplied, and state in the result which packages were not available and in which state. A package that is empty tells the review that the case has nothing there, and the review may rely on that, for example to report that a claim has no path to evidence. A package that is not implemented or withheld tells the review nothing about the case. It never silences a guideline and is never by itself a finding against the argument, and the review does not infer what it would have contained. A profile's when_absent entry, where one is published, is the only exception. The rule is for the packages around the reviewed element; if the profile's selected-element package itself is not available, there is nothing to review, and the tool reports that no review was performed rather than an empty result.
data_packages:
- id: SELECTED_CLAIM
  role: selected_element
  element_role: claim
  display_name: Selected claim
  description: The claim under review, as the selected element of a claim review.
  required_fields:
  - element_id
  - element_type
  - text
  optional_fields:
  - status
  - undeveloped
  - tags
  - notes
  field_meanings:
    element_id: The identifier of the selected element in the tool's model.
    element_type: The notation element type of the selected element, named as in selectable_elements, such as GSN Goal or CAE Claim.
    text: The full text of the selected element as the author wrote it.
    status: The element's lifecycle status in the tool, such as draft, in review, or approved.
    undeveloped: Whether the element is deliberately marked undeveloped, as true or false.
    tags: Labels the tool or the author attached to the element.
    notes: Free-text notes attached to the element that are not part of its text.

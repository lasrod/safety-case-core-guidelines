prechecks:
- id: check-explicit-strategy
  display_name: Claim has children but no explicit reasoning step
  related_guideline_ids:
  - AR.2
  expected_data:
  - SELECTED_CLAIM
  - CHILDREN
  - STRATEGY
  result_type: boolean_candidate
  description: Detects candidate cases where a claim is decomposed without an explicit reasoning step.
  fires_when: The selected claim has at least one supporting child element and no strategy or reasoning element between the claim and those children. It does not fire on a strategy that has no children; that is a different defect and is not this pre-check.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-trace
  display_name: Claim has no evidence path
  related_guideline_ids:
  - EV.1
  expected_data:
  - SELECTED_CLAIM
  - EVIDENCE_PATH
  result_type: boolean_candidate
  description: Detects candidate cases where a claim has no path to evidence and is not intentionally undeveloped.
  fires_when: No descendant of the selected claim is an evidence element, and the claim is not marked undeveloped.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-citation-precision
  display_name: Evidence reference too broad
  related_guideline_ids:
  - EV.4
  expected_data:
  - SELECTED_EVIDENCE
  - EVIDENCE_ITEM
  result_type: boolean_candidate
  description: Detects candidate cases where an evidence element cites a broad artifact without a precise location.
  fires_when: The selected evidence element names an artifact but neither its text nor the evidence item's cited_section identifies a section, clause, table, figure, dataset, or test identifier within it.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-control-attributes
  display_name: Evidence missing control attributes
  related_guideline_ids:
  - EV.7
  expected_data:
  - SELECTED_EVIDENCE
  - EVIDENCE_ITEM
  result_type: missing_fields
  description: Detects evidence references without useful control attributes such as owner, version, status, date, or location.
  fires_when: The evidence item carries none of owner, version, status, date, or location, and no such attribute is stated in the selected evidence element's text. The result names which of those fields are missing.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
- id: check-evidence-state-fixed
  display_name: Live mutable evidence reference
  related_guideline_ids:
  - EV.8
  expected_data:
  - SELECTED_EVIDENCE
  - EVIDENCE_ITEM
  result_type: boolean_candidate
  description: Detects evidence references that appear to point to mutable live documents without a fixed version.
  fires_when: The evidence reference carries a mutable-source marker (see the EV.8 markers) and carries no fixing marker such as a revision, version, snapshot, or capture date.
  interpretation: Candidate finding only; reviewer or AI judgment is still required.
authoring_guidance:
  description: The SCCG subset a tool should deliver while an author or an AI agent is writing, rather than when a review is run. Every guideline still applies; this set names the rules that are most often broken at the moment of writing and short enough to carry in a system prompt, an editor hint, or an agent's session instructions.
  usage: Render each rule from the guideline's short_rule field and cite its id. Do not paraphrase, and do not present this set as SCCG conformance; it is a delivery subset, not a reduced standard.
  core_rules:
  - id: CL.1
    category: CL
    short_rule: State each claim as a short proposition a reviewer could judge true or false.
    statement: State each claim as a sentence that can in principle be shown true or false.
    reason: A topic label written in place of a proposition cannot be reviewed, and is the most common first mistake in a new claim.
  - id: CL.2
    category: CL
    short_rule: Put one claim in one goal; separate properties that need different evidence.
    statement: Do not bundle multiple distinct properties, conclusions, or obligations into one goal.
    reason: Bundled properties are the characteristic output of a single-sentence instruction such as "argue that X is safe and secure".
  - id: CL.3
    category: CL
    short_rule: 'Keep claim text short: scope belongs in context, reasoning in a strategy, topics in sub-claims.'
    statement: Do not pack argument structure, scope, decomposition topics, and caveats into a single claim. Keep the claim short, and express the rest through context, strategy, assumptions, and sub-claims.
    reason: Authors and language models both tend to write the whole branch into one claim rather than using the structure.
  - id: CL.5
    category: CL
    short_rule: Bound every evaluative or universal qualifier in the claim, its context, or a defined term.
    statement: Do not leave broad evaluative terms or universal qualifiers unbounded. This includes terms such as safe, timely, effective, normal, robust, all, every, and never.
    reason: Unbounded qualifiers enter at writing time and are expensive to bound afterwards, once the branch below depends on the wording.
  - id: CL.6
    category: CL
    short_rule: Do not chain identification, implementation, and validation in one claim; decompose them.
    statement: Do not combine identification, adequacy, implementation, validation, and sufficiency in one claim unless the claim is intentionally kept at a higher level and the need for later decomposition is explicit
    reason: Chained lifecycle steps look like one claim while needing several evidence sets, and are easiest to separate before support is attached.
  - id: AR.1
    category: AR
    short_rule: 'Let each element do its own job: claims assert, reasoning elements explain, evidence elements cite.'
    statement: Use the assurance case structure to make each element's role clear. Claims state propositions to be established; argument elements explain the reasoning, decomposition approach, or inference rule; context and assumptions define scope and dependencies when needed; and evidence elements identify the artefacts or observations used as support.
    reason: Element role misuse is a writing-time choice; a tool can prevent it more cheaply than a review can correct it.
  - id: AR.2
    category: AR
    short_rule: State the decomposition or inference rule explicitly instead of leaving it to be inferred.
    statement: State how the parent claim is being decomposed or argued; do not make the reviewer infer the decomposition rule from wording alone.
    reason: Sub-claims added under a claim with no reasoning step is the characteristic shape of generated argument.
  - id: AR.7
    category: AR
    short_rule: Move scope, qualifiers, and dependency clauses out of claim text into context or assumptions.
    statement: Do not hide scope, operating conditions, qualifiers, definitions, interface conditions, or dependency clauses in claim text in a way that obscures scope or support. Use separate context or assumption structures where available; otherwise make the qualifiers deliberate, clear, and consistently phrased.
    reason: Scope and dependencies written into claim text are hard to separate later, once other elements refer to the claim.
  - id: EV.1
    category: EV
    short_rule: Give every claim a path to evidence, or mark it undeveloped deliberately.
    statement: Show, for each claim, the evidence path that supports it, either directly or through stated sub-claims and intermediate arguments.
    reason: A claim written with no intended evidence path should be marked undeveloped when it is written, not discovered unsupported at review.
  - id: EV.3
    category: EV
    short_rule: Claim the fact the evidence establishes, not the document that holds it.
    statement: Write the claim as the fact or property being supported; do not make the goal say that a report, analysis, or test proves the safety conclusion.
    reason: Naming the document rather than the fact is a writing habit, and it overstates what the artifact shows.
  - id: EV.4
    category: EV
    short_rule: Cite the exact section, table, figure, or test identifier, not a whole report.
    statement: Reference the exact section, figure, table, dataset, or artifact portion that supports the claim when practical.
    reason: Citation precision is cheap while the author still knows which section they meant.
  - id: EV.8
    category: EV
    short_rule: Cite a fixed, versioned, or archived state, never live mutable content.
    statement: Do not cite live mutable content as evidence unless the cited state is fixed, versioned, archived, or otherwise controlled so that the reviewed argument always refers to the same content.
    reason: A live source cited without a fixed version silently invalidates the argument later, and the fixing information is available at writing time.
  - id: SU.2
    category: SU
    short_rule: State each assumption where it constrains the argument, justify it, and monitor it where needed.
    statement: Do not rely on hidden assumptions. When a claim or reasoning step depends on a condition that must hold, state it explicitly at the point where it constrains the argument, explain why it is reasonable, and ensure it is monitored or otherwise controlled where needed. If the condition should be shown rather than assumed, argue it as a sub-claim instead.
    reason: An unstated dependency is invisible to review by definition, so it has to be stated where it is introduced, while the author still knows what they were assuming.
  - id: LF.1
    category: LF
    short_rule: Support a claim with independent grounds, never by restating or renaming it.
    statement: Do not support a claim by restating it, renaming it, or assuming it in the support.
    reason: Support that restates its parent is a common filler pattern when an author or a model has no real support to offer.
  - id: LF.3
    category: LF
    short_rule: 'Do not argue from absence: nothing found is not evidence that nothing exists.'
    statement: Do not treat lack of discovered evidence against a claim as positive evidence for the claim.
    reason: Arguing from absence reads as evidence and is not, and it is written most often when the search basis is not to hand.
  - id: RD.1
    category: RD
    short_rule: Signpost each element's role in its wording so no reader has to guess what it does.
    statement: Make it clear whether a statement is functioning as a claim, evidence reference, context, assumption, or justification.
    reason: Signposting an element's role costs nothing while writing it and cannot be recovered from the text afterwards.
  - id: RD.4
    category: RD
    short_rule: Use no promotional language; persuade through structure and evidence.
    statement: Do not use promotional, boastful, or image-enhancing language in the safety case.
    reason: Promotional wording is introduced at writing time and always weakens rather than strengthens the argument.

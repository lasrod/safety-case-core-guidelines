  index_title: RD. Rhetorical device guidance
  description: These guideline entries identify presentation choices that affect how safety arguments are understood and reviewed. They help distinguish between wording that improves clarity and wording that increases confidence without increasing support.
guidelines:
- id: CL.1
  category: CL
  title: Write each claim as a falsifiable proposition
  statement: State each claim as a sentence that can in principle be shown true or false.
  short_rule: State each claim as a short proposition a reviewer could judge true or false.
  rationale: A safety case is built from claims that can be challenged, supported, or refuted. Statements that are merely labels, headings, slogans, or references are poor safety claims.
  review_prompts:
  - Could a reviewer tell what would make this claim false?
  - Is this a proposition, or only a topic label?
  - Is the claim understandable without extra interpretation?
  - For a challenge element, does it state a specific way the target could fail, one that could be shown to hold or not?
  examples:
    bad: Brake monitor safety
    problem: This is a topic label, not a falsifiable proposition. A reviewer cannot tell what would have to be true or false to accept or reject it.
    good: Brake monitor response time meets the defined acceptance criterion.
  references:
  - source_id: ISO-IEC-IEEE-15026-2
  - source_id: OMG-SACM
  - source_id: CAE
  - source_id: UL4600
    clauses:
    - 4.2.9
    - 5.2.3.1(a)
  - source_id: GSN-v3
    clauses:
    - 1:2.3.2
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Counter Claim
    - CAE Claim
    - CAE Defeater
    detection_hints:
    - Look for goal text that is a noun phrase or topic label rather than a proposition.
    - Look for goals lacking a verb expressing a property or a measurable condition.
    markers:
    - kind: requirement_phrasing
      effect: candidate
      terms:
      - shall
      - must
      - is required to
      - needs to
    suggested_checks:
    - id: check-claim-is-proposition
      description: Check whether the claim text is a complete proposition that can be true or false. Candidate when the claim has no predicate asserting a property, or states a requirement in place of a proposition.
    repair:
    - action: reword_element
      statement: Restate the claim as a proposition with a subject and an asserted property that could be shown false.
- id: CL.2
  category: CL
  title: Put one main claim in one goal
  statement: Do not bundle multiple distinct properties, conclusions, or obligations into one goal.
  short_rule: Put one claim in one goal; separate properties that need different evidence.
  rationale: Bundled claims hide missing decomposition, make evidence assignment unclear, and produce review findings that are hard to localize.
  review_prompts:
  - Does the statement contain more than one property?
  - Would different evidence sets be needed for different parts of the claim?
  - Could one part of the statement be acceptable while another could fail?
  examples:
    bad: Planning software is safe and secure.
    problem: The claim bundles two distinct properties (safety and cybersecurity) that need different evidence and review treatment, hiding missing decomposition.
    good: 'Planning software safety is acceptable.


      And separately:


      Planning software cybersecurity is acceptable.'
  references:
  - source_id: ISO-IEC-IEEE-15026-2
  - source_id: OMG-SACM
  - source_id: CAE
  - source_id: UL4600
    clauses:
    - 5.2.3
  - source_id: GSN-v3
    clauses:
    - 1:2.3.2
  tool:
    applicable_elements:
    - GSN Goal
    - CAE Claim
    detection_hints:
    - Look for conjunctions linking distinct properties (safe and secure, complete and correct).
    - Look for goals where different properties would be supported by different evidence sets.
    markers:
    - kind: property_term
      effect: candidate
      terms:
      - safe
      - secure
      - reliable
      - available
      - correct
      - complete
      - robust
      - maintainable
      - compliant
    - kind: conjunction
      effect: candidate
      terms:
      - and
      - as well as
      - together with
      - along with
      - in addition to
    suggested_checks:
    - id: check-single-property
      description: Check whether the claim asserts a single property or bundles several distinct properties. Candidate when two or more distinct property terms are joined by a conjunction within one claim; one property term alone is not a signal.
    repair:
    - action: split_element
      statement: Split the bundled claim into one claim per property, each with its own support.
- id: CL.3
  category: CL
  title: Avoid the essay-in-the-box
  statement: Do not pack argument structure, scope, decomposition topics, and caveats into a single claim. Keep the claim short, and express the rest through context, strategy, assumptions, and sub-claims.
  short_rule: 'Keep claim text short: scope belongs in context, reasoning in a strategy, topics in sub-claims.'
  rationale: When a claim contains the whole story, reviewers cannot clearly see what is being claimed, what constrains the claim, and how the argument is intended to proceed. In GSN, that information should be visible in the structure, not hidden inside one sentence.
  review_prompts:
  - Is the goal text trying to describe both the claim and its decomposition?
  - Is scope that should be in context embedded in the claim text?
  - Are included topics listed in the claim instead of being expressed as sub-claims?
  - Would the argument become clearer if the parent claim were shortened and the included topics moved into strategy and child claims?
  examples:
    bad: The product concept and system design, including faults, failures, interfaces, dependencies, degraded operation and transitions to safe states, are acceptably safe for operation within the defined ODD.
    problem: The claim packs scope, decomposition topics, and caveats into one sentence, hiding the argument structure that should be visible through context, strategy, and sub-claims.
    good: 'Claim: Design safety is acceptable.

      Context: Applies within the defined ODD.

      Reasoning: Break the design safety claim into safety-relevant design topics.

      Sub-claims:

      - Fault handling safety is acceptable.

      - Failure response safety is acceptable.

      - Safety-relevant interfaces are acceptable.

      - Safety-relevant dependencies are acceptable.

      - Degraded operation safety is acceptable.

      - Transitions to safe states are acceptable.'
  references:
  - source_id: UL4600
    clauses:
    - 5.2.3
    - 5.3.2.1(a)
  - source_id: GSN-v3
    clauses:
    - 1:2.3.3
  tool:
    applicable_elements:
    - GSN Goal
    - CAE Claim
    detection_hints:
    - Look for claims that contain long comma-separated lists of topics.
    - Look for claim text that mixes scope, reasoning, caveats, and decomposition.
    - Look for phrases such as including, covering, considering, or with respect to introducing multiple subtopics.
    markers:
    - kind: enumeration_marker
      effect: candidate
      terms:
      - including
      - covering
      - considering
      - with respect to
      - such as
      - as well as
      - together with
    thresholds:
    - id: claim_word_count
      value: 40
      unit: words
      note: Claim text longer than this is a candidate for moving scope, reasoning, or listed topics out of the claim.
    suggested_checks:
    - id: check-claim-length-and-role-mixing
      description: Check whether the claim contains argument structure or scope that should be represented through context, strategy, assumptions, or sub-claims. Candidate when the claim exceeds the published word-count threshold, or an enumeration marker introduces a list of topics.
    - id: check-decomposition-hidden-in-claim
      description: Check whether the claim lists child topics instead of making the decomposition visible in the argument structure.
    repair:
    - action: move_text
      element_role: context
      statement: Move scope and operating conditions out of the claim into context.
    - action: add_element
      element_role: strategy
      attach_to: between_selected_and_children
      statement: State the decomposition as a reasoning step instead of listing topics in the claim.
    - action: add_element
      element_role: claim
      attach_to: children
      statement: Make each listed topic a sub-claim below the claim.
- id: CL.4
  category: CL
  title: Avoid ambiguity and overloaded wording
  statement: Write claims so that their meaning is clear enough that competent reviewers are likely to understand them in the same way.
  short_rule: Word each claim so that two competent reviewers would read it the same way.
  rationale: Ambiguous claims undermine review, traceability, and evidence relevance. This guideline directly supports UL 4600’s requirement to avoid substantive ambiguity in claims and arguments.
  review_prompts:
  - Could two competent reviewers understand the claim differently?
  - Is the object of the claim clear?
  - Is the property being claimed clear?
  examples:
    bad: Software requirements development is acceptably safe.
    problem: Both the object (development activity vs. resulting requirements) and the property (safe vs. controlled) are ambiguous, so competent reviewers may interpret the claim differently.
    good: The process used to develop software functional requirements satisfies the defined safety assurance criteria.
  references:
  - source_id: Greenwell-2006
  - source_id: NPSA-CAE
  - source_id: UL4600
    clauses:
    - 5.2.3
    - 5.2.3.1(d)
  - source_id: GSN-v3
    clauses:
    - 2:5.4.1-2:5.4.3
  distinguish_from:
  - id: CL.5
    note: Cite CL.5 when the problem is one evaluative or universal word left unbounded, such as safe, timely, or all. Cite CL.4 when the subject or the property of the claim could be read as different things altogether.
  - id: AR.4
    note: Cite AR.4 when the meaning is clear but the detail is wrong for the claim's level in the argument. Cite CL.4 when competent readers could take the claim to mean different things.
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Counter Claim
    - CAE Claim
    - CAE Defeater
    detection_hints:
    - Look for ambiguous subjects or properties (e.g. development is safe).
    - Look for claim text whose object or measured property is unclear.
    markers:
    - kind: ambiguous_qualifier
      effect: candidate
      terms:
      - appropriate
      - adequate
      - suitable
      - proper
      - satisfactory
      - reasonable
      - as applicable
      - as necessary
      - where relevant
      - if needed
    - kind: hedging_adverb
      effect: candidate
      terms:
      - acceptably
      - largely
      - generally
      - broadly
      - essentially
      - substantially
      - effectively
    suggested_checks:
    - id: check-claim-ambiguity
      description: Check whether competent reviewers would interpret the claim consistently. A marker hit is a prompt to examine the claim's subject and asserted property, not a finding on its own.
    repair:
    - action: reword_element
      statement: Reword the claim so that its subject and asserted property have one reading.
    - action: define_term
      statement: Define the ambiguous term once, and let the claim use the definition.
- id: CL.5
  category: CL
  title: Bound vague and universal qualifiers
  statement: Do not leave broad evaluative terms or universal qualifiers unbounded. This includes terms such as safe, timely, effective, normal, robust, all, every, and never.
  short_rule: Bound every evaluative or universal qualifier in the claim, its context, or a defined term.
  rationale: Terms such as safe, timely, effective, normal, robust, all, every, and never can sound stronger or broader than the argument actually shows unless they are properly bounded.
  review_prompts:
  - Is the term bounded by context, lower-level argument, or linked criteria?
  - If safe is used, is it clear what safety judgment is being claimed at this level?
  - Is the scope of all, every, or never explicitly defined?
  - Would the claim remain reviewable if read on its own?
  - In a context element, are terms such as normal, nominal, or typical conditions bounded by a definition?
  examples:
    bad: The monitor provides timely mitigation.
    problem: '"Timely" is an unbounded evaluative qualifier; without a defined threshold or condition it cannot be reviewed consistently.'
    good: Upon detection of condition C4, the monitor initiates minimum risk maneuver entry within the defined threshold.
  references:
  - source_id: Greenwell-2006
  - source_id: NPSA-CAE
  - source_id: UL4600
    clauses:
    - 5.2.3
    - 5.2.3.1(d)
  - source_id: GSN-v3
    clauses:
    - 2:5.5.1-2:5.6.1
  distinguish_from:
  - id: CL.4
    note: Cite CL.4 when the subject or the property of the claim could be read as different things altogether. Cite CL.5 when one evaluative or universal word is left unbounded.
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Context
    - CAE Claim
    - CAE Context
    detection_hints:
    - 'Look for unbounded evaluative terms: safe, robust, effective, timely, normal.'
    - 'Look for universal qualifiers without scope: all, every, never, always.'
    markers:
    - kind: unbounded_evaluative_term
      effect: candidate
      terms:
      - safe
      - robust
      - effective
      - timely
      - normal
      - nominal
      - adequate
      - acceptable
      - sufficient
      - reliable
      - appropriate
    - kind: universal_qualifier
      effect: candidate
      terms:
      - all
      - every
      - always
      - never
      - none
      - any
    - kind: bounding_marker
      effect: suppress
      terms:
      - defined
      - specified
      - documented
      - threshold
      - acceptance criterion
      - criterion
      - as defined in
      - within the
    suggested_checks:
    - id: check-bounded-qualifiers
      description: Check whether evaluative or universal qualifiers in the claim are bounded by context or measurable criteria. Candidate when an unbounded evaluative term or universal qualifier appears and no bounding marker is present in the claim, its context, or a term it uses.
    repair:
    - action: define_term
      statement: Define the qualifier once as a project term carrying its bound.
    - action: move_text
      element_role: context
      statement: State the bound as context on the claim.
- id: CL.6
  category: CL
  title: Do not mix different logical steps in one claim
  statement: Do not combine identification, adequacy, implementation, validation, and sufficiency in one claim unless the claim is intentionally kept at a higher level and the need for later decomposition is explicit
  short_rule: Do not chain identification, implementation, and validation in one claim; decompose them.
  rationale: These are different claim types with different evidence and different review questions.
  review_prompts:
  - Is this claim actually several claims chained together?
  - Would different teams or documents support different parts?
  - Should the branch be decomposed before evidence is attached?
  examples:
    bad: All identified hazards have been mitigated and validated.
    problem: The claim chains identification, implementation, and validation steps into one sentence; each step needs different evidence and a different review question.
    good: 'Parent claim: Hazards are acceptably addressed.

      Sub-claims:

      - Hazards are identified.

      - Defined mitigations are implemented.

      - Validation evidence is sufficient.'
  references:
  - source_id: ISO-IEC-IEEE-15026-2
  - source_id: OMG-SACM
  - source_id: CAE
  - source_id: UL4600
    clauses:
    - 5.2.3
    - 5.3.1
    - 5.3.2
  - source_id: GSN-v3
    clauses:
    - 1:2.3.2-1:2.3.3
  tool:
    applicable_elements:
    - GSN Goal
    - CAE Claim
    detection_hints:
    - Look for claims that chain identification + implementation + validation in one sentence.
    markers:
    - kind: lifecycle_step_verb
      effect: candidate
      terms:
      - identified
      - specified
      - implemented
      - mitigated
      - verified
      - validated
      - assessed
      - monitored
      - reviewed
    suggested_checks:
    - id: check-claim-step-mixing
      description: Check whether the claim mixes identification, adequacy, implementation, validation, and sufficiency steps. Candidate when two or more lifecycle step verbs appear within one claim.
    repair:
    - action: split_element
      statement: Separate the chained steps into sub-claims carrying one logical step each.
- id: AR.1
  category: AR
  title: Let structure carry the argument
  statement: Use the assurance case structure to make each element's role clear. Claims state propositions to be established; argument elements explain the reasoning, decomposition approach, or inference rule; context and assumptions define scope and dependencies when needed; and evidence elements identify the artefacts or observations used as support.
  short_rule: 'Let each element do its own job: claims assert, reasoning elements explain, evidence elements cite.'
  rationale: When one assurance case element is used to do another element's job, the argument becomes harder to inspect, review, and challenge.
  review_prompts:
  - Is a claim carrying reasoning that belongs in an argument, strategy, or warrant?
  - Is local scope or meaning hidden inside the claim instead of being made explicit?
  - Is a dependency or rationale hidden in claim or argument text?
  - Is an evidence reference being used as if it were a claim?
  - Is a justification being used as if it were support?
  - Is a challenge element stating a challenge, rather than a note, a claim, or its own resolution?
  examples:
    bad: 'Claim: We argue that functional design safety is acceptable by decomposing into autonomy hazard topics, given that the ISO 26262 functional design scope applies and the project requires ISO 26262 compliance, supported by the functional safety requirements, safety mechanisms, and interfaces being defined.'
    problem: The single statement bundles claim, strategy, context, justification, and sub-claims; each element's role is hidden inside one sentence rather than carried by the structure.
    good: 'Claim: Functional design safety is acceptable.

      Reasoning: Break the claim down by autonomy hazard topic.

      Scope: Functional design refers to the ISO 26262 functional design scope for the item.

      Reason for including the claim: The project requires ISO 26262 compliance.

      Sub-claims:

      - Functional safety requirements are defined.

      - Required safety mechanisms are defined.

      - Safety-relevant interfaces are defined.'
  references:
  - source_id: OMG-SACM
  - source_id: ONR
  - source_id: EASA
  - source_id: NPSA-CAE
  - source_id: UL4600
    clauses:
    - 5.2.3
    - 5.3.2.1(a)
  - source_id: GSN-v3
    clauses:
    - 1:2.2.10-1:2.2.19
    - 1:2.3.2-1:2.3.6
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Strategy
    - GSN Context
    - GSN Assumption
    - GSN Justification
    - GSN Solution
    - GSN Counter Claim
    - CAE Claim
    - CAE Argument
    - CAE Warrant
    - CAE Evidence
    - CAE Context
    - CAE Assumption
    - CAE Defeater
    detection_hints:
    - Look for goals containing reasoning verbs (we argue that, by decomposing).
    - Look for solutions phrased as claims rather than evidence references.
    - Look for assumptions or justifications buried in claim or strategy text.
    markers:
    - kind: reasoning_verb
      effect: candidate
      terms:
      - we argue that
      - by decomposing
      - argument over
      - this is shown by
      - it follows that
    suggested_checks:
    - id: check-element-role-misuse
      description: Check whether each element is used for its intended role in the notation. Candidate when reasoning wording appears in a claim, when a claim's wording appears in an evidence element, or when rationale or scope is stated inside another element's text.
    repair:
    - action: move_text
      statement: Move each part of the text into the element whose role it plays.
- id: AR.2
  category: AR
  title: State the inference step explicitly
  statement: State how the parent claim is being decomposed or argued; do not make the reviewer infer the decomposition rule from wording alone.
  short_rule: State the decomposition or inference rule explicitly instead of leaving it to be inferred.
  rationale: A hidden reasoning step is a common source of argument gaps.
  review_prompts:
  - Is the decomposition rule visible?
  - Would another reviewer derive the same child-claim set?
  - Does the strategy explain why these children support this parent?
  examples:
    bad: Perception, planning, control, timing, and interfaces are adequately addressed.
    problem: The decomposition rule is not stated; a reviewer cannot tell why these specific children were chosen or whether they together support the parent.
    good: 'Claim: Autonomy function safety is acceptable.

      Reasoning: Break the claim down by the autonomy function topics identified by UL 4600.

      Reason for this breakdown: These topics match the autonomy-related topics that UL 4600 expects the safety case to address.

      Sub-claims:

      - ODD-related safety is acceptable.

      - Sensing safety is acceptable.

      - Perception safety is acceptable.

      - Machine learning and AI technique safety is acceptable.

      - Planning safety is acceptable.

      - Prediction safety is acceptable.

      - Trajectory and control safety is acceptable.

      - Actuation safety is acceptable.

      - Timing safety is acceptable.'
  references:
  - source_id: OMG-SACM
  - source_id: ONR
  - source_id: EASA
  - source_id: NPSA-CAE
  - source_id: UL4600
    clauses:
    - 5.3.2.1(a)
    - 5.3.2.1(a)(1)
  - source_id: GSN-v3
    clauses:
    - 1:2.3.3
  - source_id: CAE
  tool:
    applicable_elements:
    - GSN Strategy
    - CAE Argument
    - CAE Warrant
    detection_hints:
    - Look for branches with sub-claims but no strategy element explaining the decomposition rule.
    - Look for parent claims whose decomposition rule is implicit in the wording.
    suggested_checks:
    - id: check-explicit-strategy
      description: Check whether each decomposition has an explicit reasoning step stating how children support the parent.
    repair:
    - action: add_element
      element_role: strategy
      attach_to: between_selected_and_children
      statement: Insert an explicit reasoning step stating how the children support the claim.
- id: AR.4
  category: AR
  title: Match claim precision to the level of the argument
  statement: Keep upper-level claims short and stable; make evidence-facing claims precise enough to assess.
  short_rule: Keep upper-level claims short and stable; make evidence-facing claims precise enough to assess.
  rationale: Top-level claims need readability and stability. Lower-level claims need assessability.
  review_prompts:
  - Is a high-level claim overloaded with low-level detail?
  - Is a leaf claim too vague to assess against evidence?
  - Could the claim stay short because linked criteria already make it objective?
  examples:
    bad: 'Upper-level claim: Detection timing meets the defined acceptance criterion.'
    problem: Using an evidence-facing precision at the top of the argument makes the upper level brittle and tied to specific measurements; upper-level claims should remain short and stable while leaf claims carry the precision needed to assess against evidence.
    good: 'Upper level: Functional design safety is acceptable.

      Lower level: Sensing-related hazards are identified.

      Evidence-facing level: Detection timing meets the defined acceptance criterion.'
  references:
  - source_id: UL4600
    clauses:
    - 5.2.3
    - 5.4.2.1(b)
  - source_id: GSN-v3
    clauses:
    - Part 2 §2:2
  distinguish_from:
  - id: CL.4
    note: Cite CL.4 when competent readers could take the claim to mean different things, at any level. Cite AR.4 when the meaning is clear but the detail is wrong for where the claim sits, overloaded near the top or too vague to assess at a leaf.
  tool:
    applicable_elements:
    - GSN Goal
    - CAE Claim
    detection_hints:
    - Look for top-level claims overloaded with measurement detail.
    - Look for leaf claims too vague to compare with evidence.
    suggested_checks:
    - id: check-precision-by-level
      description: Check whether claim precision matches argument level.
    repair:
    - action: reword_element
      statement: Shorten an overloaded upper-level claim, or make a leaf claim precise enough to assess against its evidence.
- id: AR.5
  category: AR
  title: Keep scope and terminology consistent across decomposition
  statement: Do not silently redefine the object, scope, or meaning of key terms as the argument decomposes.
  short_rule: Keep the object, scope, and terminology of a claim unchanged as the argument decomposes.
  rationale: Silent redefinition can leave higher-level claims only partially supported while appearing complete.
  review_prompts:
  - Does a key term mean the same thing at parent and sub-claim levels?
  - Has scope narrowed without being stated?
  - Is inherited context still valid at this level?
  - Does a context element restate, redefine, or contradict context already given higher in the same branch?
  examples:
    bad: 'Parent claim: Software safety is acceptable.

      Strategy: Argument by software component type.

      Child claims:

      - Application software safety is acceptable.

      - Middleware software safety is acceptable.'
    problem: The parent claim refers to all software, but the child claims silently narrow the scope to only part of the software. The branch appears complete while leaving other software out of scope without saying so.
    good: 'Parent claim: Software safety is acceptable.

      Context: Software in scope comprises application, middleware, platform, and driver layers.

      Reasoning: Break the software safety claim down by software component type, covering all layers in scope.

      Child claims:

      - Application software safety is acceptable.

      - Middleware software safety is acceptable.

      - Platform software safety is acceptable.

      - Driver software safety is acceptable.'
  references:
  - source_id: UL4600
    clauses:
    - 5.2.3
  - source_id: GSN-v3
    clauses:
    - 1:2.2.11
    - 2:5.5.3
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Context
    - CAE Claim
    - CAE Context
    detection_hints:
    - Look for parent/child pairs where a key noun's scope changes silently.
    - Look for two context elements in one branch that define the same term, scope, or ODD differently.
    suggested_checks:
    - id: check-scope-consistency
      description: Check whether key terms preserve scope across decomposition.
    repair:
    - action: add_element
      element_role: context
      attach_to: selected
      statement: State the full scope the decomposition is meant to cover as context on the parent.
    - action: add_element
      element_role: claim
      attach_to: children
      statement: Add the sub-claims needed to cover the parent's stated scope.
- id: AR.6
  category: AR
  title: Provide the context needed to interpret the claim
  statement: Provide the context a reviewer needs to interpret the claim, that is, what its subject is, what it means, what scope it covers, and how its key terms are defined.
  short_rule: Give each claim the context a reviewer needs to interpret its subject, scope, and key terms.
  rationale: This guideline is about whether the information needed to read the claim is present in the branch at all. In GSN, claims are asserted in a specified context. A claim that lacks essential context can look stronger than intended or become hard to review consistently because different readers may supply different meanings or boundaries. It is not about conditions the claim depends on being true, which are assumptions (SU.2), about limits of the support (RD.3), or about context that is present but written into the claim text (AR.7).
  review_prompts:
  - What must the reviewer know to understand what this claim says?
  - Are key terms defined where needed?
  - Is the scope the claim covers explicit?
  - Would two independent reviewers understand the claim in the same way?
  examples:
    bad: Perception performance is acceptable.
    problem: Perception performance is not defined, so different reviewers may understand different outputs, measures, or success conditions.
    good: 'Claim: Perception performance is acceptable.

      Definition: Perception performance refers to object detection, classification, and tracking performance as defined in Specification PER-01.'
  references:
  - source_id: OMG-SACM
  - source_id: ONR
  - source_id: EASA
  - source_id: NPSA-CAE
  - source_id: UL4600
    clauses:
    - 5.2.3
  - source_id: GSN-v3
    clauses:
    - 1:2.2.10-1:2.2.11
    - 1:2.3.5
  distinguish_from:
  - id: AR.7
    note: Cite AR.7 when the context is present but carried inside the claim text. Cite AR.6 when it is missing from the branch altogether.
  - id: SU.2
    note: Cite SU.2 when what is missing is a condition that must hold for the claim to be true. Cite AR.6 when it is information needed to understand what the claim means.
  - id: RD.3
    note: Cite RD.3 when what is missing is a known limit of the support or its coverage. Cite AR.6 when it is the subject, meaning, or scope of the claim itself.
  - id: RD.2
    note: Cite RD.2 when the wording claims more certainty than the support gives. Cite AR.6 when the branch states the claim's scope nowhere, neither in the claim nor in its context, however the claim is worded.
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Context
    - CAE Claim
    - CAE Context
    detection_hints:
    - Look for claims using domain terms that are not defined in any linked context.
    suggested_checks:
    - id: check-context-presence
      description: Check whether the claim has enough linked context for consistent interpretation.
    repair:
    - action: add_element
      element_role: context
      attach_to: selected
      statement: Add the context that defines the claim's subject, scope, and key terms.
- id: AR.7
  category: AR
  title: Make claim qualifiers explicit and maintainable
  statement: Do not hide scope, operating conditions, qualifiers, definitions, interface conditions, or dependency clauses in claim text in a way that obscures scope or support. Use separate context or assumption structures where available; otherwise make the qualifiers deliberate, clear, and consistently phrased.
  short_rule: Move scope, qualifiers, and dependency clauses out of claim text into context or assumptions.
  rationale: This guideline is about placement, clarity, and maintainability. A claim such as "X is acceptable in ODD-A during automated mode with valid localization" carries its scope and its dependencies in one sentence; the scope belongs in context and the dependencies in assumptions. Hidden qualifiers blur element roles, make scope and dependency changes harder to see, and often create claims that are difficult to review and maintain.
  review_prompts:
  - Is this text making the claim itself, defining the claim's scope, or stating a dependency that must hold?
  - Which words in this claim are qualifiers rather than the core assertion?
  - Are the qualifiers clear enough for review, or would they be better represented as context or assumptions?
  - Could the core claim remain stable if a configuration, interface condition, or dependency changed?
  - Are dependencies explicit and traceable rather than hidden inside readable but overloaded claim text?
  examples:
    bad: Planner safety is acceptable with valid localization and nominal interface timing.
    problem: Qualifiers ("with valid localization", "nominal interface timing") are buried in the claim text, blurring the role of each element and making scope and dependency changes harder to see.
    good: 'Claim: Planner safety is acceptable.

      Definition: Planner refers to the motion planning function defined in architecture element PLN-01.

      Dependencies:

      - Valid localization is available.

      - Nominal interface timing conditions apply.'
  references:
  - source_id: OMG-SACM
  - source_id: ONR
  - source_id: EASA
  - source_id: NPSA-CAE
  - source_id: UL4600
    clauses:
    - 5.2.3
    - 5.3.2.1(a)
    - 5.4.1.3(a)(11)
  - source_id: GSN-v3
    clauses:
    - 1:2.2.10-1:2.2.18
  - source_id: CAE
  distinguish_from:
  - id: AR.6
    note: Cite AR.6 when the context is missing from the branch altogether. Cite AR.7 when it is present but written into the claim text.
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Context
    - GSN Assumption
    - CAE Claim
    - CAE Context
    - CAE Assumption
    detection_hints:
    - Look for connectives in claim text such as with, given, assuming, provided that, when.
    - Look for scope phrases in claim text such as in ODD X or during mode Y.
    markers:
    - kind: qualifier_connective
      effect: candidate
      terms:
      - with
      - given
      - assuming
      - provided that
      - subject to
      - conditional on
      - when
      - during
    suggested_checks:
    - id: check-claim-text-purity
      description: Check whether scope phrases and qualifying or dependency clauses in claim text should move to context or assumption elements. Candidate when a qualifier connective introduces a clause that bounds the claim rather than asserting it.
    repair:
    - action: move_text
      element_role: context
      statement: Move qualifiers that define scope into context.
    - action: move_text
      element_role: assumption
      statement: Move dependency clauses into an assumption.
- id: AR.8
  category: AR
  title: Do not use rationale as hidden support
  statement: Use rationale, warrant, or justification text to explain why a wording, boundary, decomposition, or inference choice is acceptable; do not use it as the proof that a claim is true.
  short_rule: Use rationale to explain a choice, never as the support that makes a claim true.
  rationale: Rationale can explain local reasoning choices, but it cannot replace sub-claims, evidence, or a clear argument linking evidence to the claim. Treating rationale as support hides missing reasoning, missing evidence, or unsupported assumptions.
  review_prompts:
  - Is the rationale explaining a local choice, or trying to carry evidential weight?
  - If the rationale were removed, would the real support for the claim still remain?
  examples:
    bad: 'Claim: Brake hazards are adequately addressed.

      Rationale: The verification campaign passed all planned brake fault tests.'
    problem: The rationale is being used as proof. The test results should be cited as evidence and linked to the claim through clear sub-claims or reasoning.
    good: 'Claim: Brake hazards are adequately addressed.

      Sub-claims:

      - Brake hazards are identified.

      - Mitigations for identified brake hazards are implemented.

      - Mitigation effectiveness is verified.

      Evidence: Brake hazard verification report BVR-09.

      Rationale for grouping: Hazards are grouped by actuator path because that grouping matches the mitigation architecture.'
  references:
  - source_id: OMG-SACM
  - source_id: ONR
  - source_id: EASA
  - source_id: NPSA-CAE
  - source_id: UL4600
    clauses:
    - 5.2.3
    - 5.3.2.1(a)
  - source_id: GSN-v3
    clauses:
    - 1:2.2.14
    - 1:2.3.6
  tool:
    applicable_elements:
    - GSN Justification
    - CAE Warrant
    - CAE Side-warrant
    - CAE Side-claim
    detection_hints:
    - Look for justifications that cite test results or evidence rather than rationale.
    suggested_checks:
    - id: check-justification-misuse
      description: Check whether the justification carries evidential weight that should sit in evidence or sub-claims.
    repair:
    - action: add_element
      element_role: evidence
      attach_to: children
      statement: Cite the artifact as evidence instead of asserting it in the rationale.
    - action: add_element
      element_role: claim
      attach_to: children
      statement: Add the sub-claims that connect that evidence to the claim.
- id: AR.9
  category: AR
  title: Match each rationale to the element or inference it explains
  statement: Any rationale, warrant, or justification shall address the exact claim, argument, or inference step to which it is attached and shall not explain a different issue elsewhere in the branch.
  short_rule: Keep each rationale local to the exact element or inference step it explains.
  rationale: Misaligned rationale creates false confidence and often reveals that the real concern is missing context, missing decomposition, missing evidence, or an unstated inference rule.
  review_prompts:
  - Does the rationale explain why this exact claim formulation, decomposition, or inference is acceptable?
  - Is it local, or is it trying to justify the whole branch?
  - Could the same text be pasted onto many different elements without change?
  examples:
    bad: 'Claim: Sensor faults are adequately addressed.

      Rationale: The item is intended for highway use.'
    problem: The rationale does not explain why this exact claim, breakdown, or reasoning step is acceptable; "intended for highway use" is scope information that belongs elsewhere and could be pasted onto many unrelated elements.
    good: 'Claim: Sensor faults are adequately addressed.

      Scope: Applies to the highway operational design domain.

      Local rationale: Sensor faults are grouped by detection mechanism because the mitigation set is organized along the same lines.'
  references:
  - source_id: OMG-SACM
  - source_id: ONR
  - source_id: EASA
  - source_id: NPSA-CAE
  - source_id: UL4600
    clauses:
    - 5.2.3
  - source_id: GSN-v3
    clauses:
    - 1:2.2.14-1:2.2.19
  tool:
    applicable_elements:
    - GSN Justification
    - CAE Warrant
    - CAE Side-warrant
    - CAE Side-claim
    detection_hints:
    - Look for justifications that could be moved to other elements without losing meaning.
    suggested_checks:
    - id: check-justification-locality
      description: Check whether the justification is local to its attached element.
    repair:
    - action: reword_element
      statement: Rewrite the rationale so that it explains this exact element or inference step.
    - action: move_text
      element_role: context
      statement: Move scope information out of the rationale into context.
- id: EV.1
  category: EV
  title: Make the evidence-support path explicit for every claim
  statement: Show, for each claim, the evidence path that supports it, either directly or through stated sub-claims and intermediate arguments.
  short_rule: Give every claim a path to evidence, or mark it undeveloped deliberately.
  rationale: A safety case without traceability cannot be effectively reviewed or maintained.
  review_prompts:
  - Can the reviewer identify the intended evidence path without having to infer it?
  - Is it clear which evidence path ultimately supports this claim?
  - Would two reviewers follow the same trace to the same evidence?
  examples:
    bad: 'Claim: Detection timing is acceptable.

      Linked solution: System validation report.'
    problem: The reviewer cannot tell which test, section, or lower-level argument is intended to show that detection timing is acceptable. The trace exists only in the author's head.
    good: 'Claim: Detection timing is acceptable.

      Sub-claim: Detection latency meets acceptance criterion AC-DET-07 for scenarios S1-S12.

      Solution: System validation report SVR-04, section 6.3, table 12 (scenarios S1-S12).'
  references:
  - source_id: ONR
  - source_id: UNECE-ADS
  - source_id: UL4600
    clauses:
    - 5.4.1.1(a)
    - 5.4.1.6.1
  - source_id: GSN-v3
    clauses:
    - 2:3.7.3
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Solution
    - CAE Evidence
    - CAE Claim
    detection_hints:
    - Look for claims with no traceable path to evidence.
    - Look for solutions linked to claims without intermediate sub-claims when needed.
    suggested_checks:
    - id: check-evidence-trace
      description: Check whether each claim has an explicit evidence path through sub-claims or direct solutions.
    repair:
    - action: add_element
      element_role: evidence
      attach_to: children
      statement: Attach the evidence element that supports the claim.
    - action: mark_undeveloped
      statement: If no evidence is intended yet, mark the claim undeveloped deliberately rather than leaving the gap silent.
- id: EV.2
  category: EV
  title: Use evidence types that can be independently reviewed
  statement: Do not use evidence unless its artifact type is defined for safety case use and the artifact meets the criteria required for that type, so that it can be reviewed and assessed consistently.
  short_rule: Cite only artifacts whose evidence type is defined and whose criteria for that type are met.
  rationale: A reviewer should be able to recognize what kind of evidence is being used, what makes it acceptable for this purpose, and how it should be interpreted. If an artifact is not an approved evidence type, or does not meet the criteria required for that type, it becomes difficult to review consistently and easy to misuse in a safety argument.
  review_prompts:
  - Is the evidence type clearly defined?
  - Is the expected structure or content of the artifact defined?
  - Is it clear how the artifact is to be interpreted?
  - Is there a defined basis for reviewing, validating, or accepting this evidence type?
  - Could an independent reviewer examine the artifact consistently without relying on undocumented local knowledge?
  examples:
    bad: 'Claim: Perception validation evidence is sufficient for this claim.

      Evidence: Engineer working file WF-27.'
    problem: WF-27 is an engineer working file, not an approved evidence type for this claim. The reviewer cannot tell how to assess it.
    good: 'Claim: Perception validation evidence is sufficient for this claim.

      Evidence: Perception validation report PVR-08, rev B.

      Evidence type: A validation report is an approved evidence type for this kind of claim.

      Evidence basis: PVR-08 meets the defined criteria for that evidence type.'
  references:
  - source_id: Weaver
  - source_id: Hawkins
  - source_id: CAE-Concepts
  - source_id: UL4600
    clauses:
    - 5.2.2
    - 5.2.2.1(a)-(b)
  tool:
    applicable_elements:
    - GSN Solution
    - CAE Evidence
    detection_hints:
    - Look for evidence references to ad-hoc or working artifacts (working file, draft notes).
    markers:
    - kind: ad_hoc_artifact_marker
      effect: candidate
      terms:
      - working file
      - draft notes
      - scratch
      - personal notes
      - notebook
      - work in progress
      - temporary
    suggested_checks:
    - id: check-evidence-type-defined
      description: Check whether the evidence type is defined and the artifact meets the type's criteria. Candidate when an ad-hoc artifact marker names the cited artifact.
    repair:
    - action: reword_element
      statement: Cite an artifact whose evidence type is defined for this use, or state the criteria that make this artifact acceptable for that type.
- id: EV.3
  category: EV
  title: Claim the fact supported by the evidence, not the document
  statement: Write the claim as the fact or property being supported; do not make the goal say that a report, analysis, or test proves the safety conclusion.
  short_rule: Claim the fact the evidence establishes, not the document that holds it.
  rationale: Evidence usually supports a specific fact or bounded property, not the whole safety conclusion by itself.
  review_prompts:
  - Is the goal naming a document instead of a supported property?
  - Is the evidential link too large for the cited artifact?
  - Would the claim remain meaningful if the artifact name changed?
  examples:
    bad: TR-21 proves the braking controller is safe.
    problem: A test report supports a specific bounded property, not a whole safety conclusion; making the document the subject of the claim overreaches what the cited artifact can show.
    good: Braking controller stopping distance meets acceptance criterion AC-BRK-04.
  references:
  - source_id: UL4600
    clauses:
    - 5.4.2.1(c)(1)
  - source_id: GSN-v3
    clauses:
    - 1:2.3.4
    - 2:3.7.3
  tool:
    applicable_elements:
    - GSN Goal
    - CAE Claim
    detection_hints:
    - Look for claim text that names a report, document, or analysis as the subject.
    markers:
    - kind: evidential_verb
      effect: candidate
      terms:
      - proves
      - demonstrates that the system
      - shows that the system
      - confirms safety
    - kind: artifact_noun_subject
      effect: candidate
      terms:
      - report
      - analysis
      - document
      - record
      - memo
      - study
      - assessment
    suggested_checks:
    - id: check-claim-subject-not-document
      description: Check whether the claim subject is a property rather than a document. Candidate when an artifact noun is the subject of the claim, or an evidential verb makes an artifact the thing that proves the conclusion.
    repair:
    - action: reword_element
      statement: Restate the claim as the fact the cited artifact establishes.
- id: EV.4
  category: EV
  title: Cite precise evidence locations; avoid annex dumping
  statement: Reference the exact section, figure, table, dataset, or artifact portion that supports the claim when practical.
  short_rule: Cite the exact section, table, figure, or test identifier, not a whole report.
  rationale: Broad references to whole reports create the illusion of support without making the evidential link easy to review.
  review_prompts:
  - Could a reviewer find the relevant support quickly?
  - Is the cited location precise enough?
  - Is the reference proportionate to the actual support being used?
  examples:
    bad: See validation report.
    problem: A whole-report citation creates the appearance of support without making the evidential link easy to review; the reviewer cannot find the relevant material quickly.
    good: See validation report VR-04, section 6.3, table 12, scenarios S14-S21.
  references:
  - source_id: ONR
  - source_id: UNECE-ADS
  - source_id: UL4600
    clauses:
    - 5.4.1.1(a)
    - 5.4.2.1(c)(1)
  - source_id: GSN-v3
    clauses:
    - 2:3.7.4
  tool:
    applicable_elements:
    - GSN Solution
    - CAE Evidence
    detection_hints:
    - Look for evidence references that name an entire report without section/table/figure.
    markers:
    - kind: citation_precision_marker
      effect: expected
      terms:
      - section
      - clause
      - table
      - figure
      - annex
      - appendix
      - page
      - chapter
      - dataset
      - test id
      - scenario
      - item
    suggested_checks:
    - id: check-evidence-citation-precision
      description: Check whether evidence references are specific enough to be quickly verified. Candidate when an evidence reference names an artifact and carries no citation precision marker.
    repair:
    - action: reword_element
      statement: Add the section, table, figure, dataset, or test identifier that carries the support.
- id: EV.5
  category: EV
  title: Make the basis for evidence sufficiency explicit
  statement: When a claim is supported by evidence, make clear what makes that evidence sufficient for that claim.
  short_rule: State what makes the cited evidence sufficient for this claim, not only relevant to it.
  rationale: A reviewer should not have to guess why a cited test, analysis, dataset, or review record is enough. The argument should make the sufficiency basis visible, such as relevant scope, configuration, scenario coverage, thresholds, acceptance conditions, and known limitations. Whether a basis is stated can be seen in the argument itself, so this guideline can be assessed without any evidence basis data; whether a stated basis is actually adequate is judged under LF.5, SU.7, and SU.8.
  review_prompts:
  - What makes this evidence enough for this claim?
  - Is the required scope, configuration, scenario set, or operating condition clear?
  - Is any threshold, pass criterion, or completeness expectation stated?
  - Are known limitations or uncovered conditions explicit?
  - Is the branch showing only that the evidence is relevant, or also that it is enough?
  examples:
    bad: 'Claim: Perception performance is acceptable.

      Evidence: Perception validation report PVR-08.'
    problem: The report is cited, but the argument does not state what coverage, thresholds, configurations, or limitations make that report sufficient for this claim.
    good: 'Claim: Perception performance is acceptable for ODD-A daytime operation.

      Evidence: Perception validation report PVR-08.

      Context: Applies to software build SB-14 and sensor configuration C3.

      Justification: Sufficiency is based on scenario coverage SC-21, acceptance thresholds AC-PER-04 to AC-PER-07, and the stated exclusion of dense fog conditions.'
  references:
  - source_id: Weaver
  - source_id: Hawkins
  - source_id: CAE-Concepts
  - source_id: UL4600
    clauses:
    - 5.4.2.1(b)-(c)
    - 5.3.2.1(a)(1)
  distinguish_from:
  - id: LF.5
    note: Cite LF.5 when the argument states what makes its evidence sufficient, or the evidence shows it, and the sample is too small or unrepresentative for the claim. Cite EV.5 when the argument does not state a sufficiency basis at all.
  tool:
    applicable_elements:
    - GSN Solution
    - GSN Justification
    - CAE Evidence
    - CAE Warrant
    detection_hints:
    - Look for evidence cited without scope, threshold, or coverage justification.
    markers:
    - kind: sufficiency_basis_marker
      effect: expected
      terms:
      - coverage
      - threshold
      - acceptance criterion
      - scenario
      - configuration
      - limitation
      - exclusion
      - sample
      - scope
    suggested_checks:
    - id: check-evidence-sufficiency-basis
      description: Check whether the basis for evidence sufficiency is explicit. Candidate when evidence is cited and no sufficiency basis marker appears in the branch.
    repair:
    - action: add_element
      element_role: justification
      attach_to: selected
      statement: State the coverage, thresholds, configuration, and limitations that make the evidence sufficient.
- id: EV.6
  category: EV
  title: Explain how the evidence supports or refutes the claim
  statement: Ensure the inferential link between claim and evidence is explicitly documented and reviewable. The documentation shall explain how the cited evidence supports the claim, and where relevant how it reveals limitations or possible refutation.
  short_rule: Document why the cited evidence bears on this claim, including what it does not cover.
  rationale: Evidence does not speak for itself. The safety case or linked assessment record must explain why the evidence bears on the claim.
  review_prompts:
  - Is it explicit why this evidence matters for this claim?
  - Is the inferential link documented in a reviewable form?
  - Does the documentation explain only support, or also limitations and possible refutation?
  - Has confirmation bias been considered?
  examples:
    bad: 'Claim: Detection timing meets acceptance criterion AC-DET-07.

      Solution: Timing test report TR-18, section 5.2.'
    problem: The evidence is linked, but the reason it supports the claim is not explicitly documented anywhere reviewable; relevance, coverage, and limitations remain implicit.
    good: 'Claim: Detection timing meets acceptance criterion AC-DET-07.

      Solution: Timing test report TR-18, section 5.2.

      Inferential explanation: TR-18 shows measured detection latency below AC-DET-07 for scenarios S1-S12 in configuration C4. This supports the claim for that scenario set and configuration. Degraded sensor mode D3 is not covered and remains outside the supported scope.'
  references:
  - source_id: Weaver
  - source_id: Hawkins
  - source_id: CAE-Concepts
  - source_id: UL4600
    clauses:
    - 5.4.2.1(c)(1)-(2)
  tool:
    applicable_elements:
    - GSN Solution
    - CAE Evidence
    detection_hints:
    - Look for evidence linked to claims without an accompanying inferential explanation.
    suggested_checks:
    - id: check-inferential-link-documented
      description: Check whether the inferential link between claim and evidence is reviewable.
    repair:
    - action: add_element
      element_role: justification
      attach_to: selected
      statement: Document why this evidence bears on this claim and what it does not cover.
- id: EV.7
  category: EV
  title: 'Keep evidence controlled: owner, version, date, status, repository'
  statement: Evidence cited in the safety case should be under configuration or document control, with clear ownership, version or revision, date, status, and a stable retrieval location. Do not rely on mutable live documents as evidence unless the cited version is fixed or the change process explicitly triggers re-assessment of the affected claim.
  short_rule: 'Keep evidence controlled: owner, version, date, status, and a stable retrieval location.'
  rationale: Uncontrolled or mutable evidence is hard to verify, maintain, and re-assess. If a cited artifact can change after review, the argument may silently lose validity while still appearing supported.
  review_prompts:
  - Who owns the evidence?
  - Which version or revision is being cited?
  - Is the evidence retrieved from a controlled location?
  - Is the cited artifact fixed, or can it still change?
  - If it is a live document, is there an explicit mechanism that re-assesses affected claims when the document changes?
  - Is its status clear, for example draft, in review, approved, or released?
  examples:
    bad: 'Evidence: Test summary on team wiki.'
    problem: The cited source has no fixed revision, no clear approval state, and no stable retrieval point for future review; the argument may silently lose validity if the page changes.
    good: 'Evidence: Test summary TSR-11, rev D, approved 2026-03-14, owner Safety Validation Team, stored in the controlled evidence repository.'
  references:
  - source_id: RA1205
  - source_id: ONR
  - source_id: AVSC-CSE
    clauses:
    - '3.8'
    - '6.1'
    - Table 2
  - source_id: UL4600
    clauses:
    - 5.2.2
    - 5.4.2.1(b)
  tool:
    applicable_elements:
    - GSN Solution
    - CAE Evidence
    detection_hints:
    - Look for evidence references with no version, date, owner, or controlled location.
    markers:
    - kind: control_attribute_marker
      effect: expected
      terms:
      - owner
      - rev
      - revision
      - version
      - issue
      - approved
      - released
      - status
      - dated
      - repository
    - kind: uncontrolled_source_marker
      effect: candidate
      terms:
      - wiki
      - confluence
      - sharepoint
      - google doc
      - shared drive
      - team page
      - draft
    suggested_checks:
    - id: check-evidence-control-attributes
      description: Check whether each evidence reference includes owner, version, date, status, and stable location (directly or via linked control mechanism). Candidate when none of the control attribute markers is present; the result names which are missing.
    repair:
    - action: reword_element
      statement: Add owner, version or revision, date, status, and a controlled retrieval location to the reference.
- id: EV.8
  category: EV
  title: Cite fixed evidence, not live mutable content
  statement: Do not cite live mutable content as evidence unless the cited state is fixed, versioned, archived, or otherwise controlled so that the reviewed argument always refers to the same content.
  short_rule: Cite a fixed, versioned, or archived state, never live mutable content.
  rationale: This rule is the specific citation case of EV.7. If cited evidence can change after review, the safety case may appear supported while its actual evidential basis has changed or disappeared. This breaks reproducibility, reviewability, and configuration control.
  review_prompts:
  - Could this cited content change without the safety case being updated?
  - Is the cited state fixed, versioned, or archived?
  - Can a future reviewer retrieve the exact same content that was reviewed?
  - If the source is live, is there an explicit process that triggers re-assessment of affected claims when it changes?
  examples:
    bad: See braking verification page in Confluence.
    problem: The cited page is mutable; future reviewers cannot retrieve the same content that was originally reviewed, which breaks reproducibility and configuration control.
    good: 'See Braking Verification Plan BVP-04, rev C, approved 2026-03-11.


      Or, equivalently: See archived snapshot of Confluence page CP-118, version 17, captured 2026-03-11.'
  references:
  - source_id: RA1205
  - source_id: ONR
  - source_id: AVSC-CSE
    clauses:
    - '3.8'
    - '6.1'
    - Table 2
  - source_id: UL4600
    clauses:
    - 5.1.1.1(b)-(c)
    - 5.2.2
    - 5.4.1.1(a)
  tool:
    applicable_elements:
    - GSN Solution
    - CAE Evidence
    detection_hints:
    - Look for citations to wikis, live shared docs, or other mutable URLs without a fixed version or snapshot.
    markers:
    - kind: mutable_source_marker
      effect: candidate
      terms:
      - wiki
      - confluence
      - sharepoint
      - google doc
      - live
      - latest
      - current
      - main branch
      - trunk
      - page
    - kind: fixing_marker
      effect: suppress
      terms:
      - rev
      - revision
      - version
      - snapshot
      - captured
      - archived
      - baseline
      - tag
      - commit
      - approved
      - dated
    suggested_checks:
    - id: check-evidence-state-fixed
      description: Check whether the cited content state is fixed, versioned, or archived. Candidate when a mutable source marker is present and no fixing marker accompanies it.
    repair:
    - action: reword_element
      statement: Cite a fixed revision, version, or archived snapshot rather than live content.
- id: EV.9
  category: EV
  title: Do not argue directly from undocumented system knowledge
  statement: Do not support claims by relying on undocumented engineering knowledge, design understanding, or verbal explanation. Claims about system behavior, design, interfaces, mitigations, or operating limits should be grounded in controlled documentation or other identified evidence.
  short_rule: Argue from cited documentation, not from undocumented engineering knowledge.
  rationale: A safety case should argue from reviewable evidence, not from what engineers happen to know. When system knowledge is written directly into the safety case without a supporting source, the argument becomes hard to verify, hard to maintain, and difficult to assess for completeness. It also becomes unclear whether the claim is supported by an approved design basis or only by current team understanding.
  review_prompts:
  - Is this claim supported by controlled documentation or other identified evidence?
  - Is the safety case describing how the system works instead of arguing from documented sources?
  - Would the claim still be supportable if the original engineer were unavailable?
  - Should this material be moved to a specification, design description, interface definition, hazard analysis, or other work product and then cited as evidence?
  examples:
    bad: 'Claim: Unsafe torque requests are prevented during degraded localization.

      The safety case includes a free-text explanation of the controller behavior, but the relevant design basis is not identified through context and no supporting artifacts are linked.'
    problem: The claim relies on undocumented system knowledge instead of controlled artifacts.
    good: 'Claim: Unsafe torque requests are prevented during degraded localization.

      Design basis: Braking control design specification BCS-02, degraded-mode requirements DMR-04, and interface definition IFD-07.

      Evidence: Verification report VFR-11 shows that the specified behavior is implemented and verified.'
  references:
  - source_id: UL4600
    clauses:
    - 5.1.1.2(e)
    - 5.3.2.1(a)(2)
    - 5.7.1.6.1
  - source_id: GSN-v3
    clauses:
    - 2:3.7.3
  - source_id: CAE
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Strategy
    - CAE Claim
    - CAE Argument
    detection_hints:
    - Look for free-text design explanations in the safety case without linked specification or evidence.
    suggested_checks:
    - id: check-undocumented-knowledge
      description: Check whether the argument relies on undocumented system knowledge rather than cited artifacts.
    repair:
    - action: add_element
      element_role: evidence
      attach_to: children
      statement: Cite the design basis as evidence rather than describing system behaviour in the argument.
    - action: add_element
      element_role: context
      attach_to: selected
      statement: Identify the specification or interface definition as context.
- id: SU.1
  category: SU
  title: Identify and address plausible challenges to claims, reasoning, and evidence
  statement: Where a reviewer could reasonably question whether a claim, reasoning step, evidence item, assumption, or stated scope is valid, complete, applicable, or sufficiently reliable, make that challenge explicit and address it where needed.
  short_rule: Make plausible challenges to the claim, reasoning, or evidence visible, and address them.
  rationale: A credible safety case should not only present supporting material. It should also make important doubts visible and show how they are handled. This fits well with GSN-style review, where challenge is used to test whether a claim, inference, or supporting material still stands when subjected to scrutiny.
  review_prompts:
  - What could invalidate this claim or reasoning step?
  - What assumptions, confounders, uncertainties, or biases are relevant here?
  - Could this evidence be incomplete, misleading, or outside the supported scope?
  - Is the challenge really against the claim, the reasoning, the evidence, an assumption, or the stated scope?
  - Are important doubts visible in the argument, or left unstated?
  examples:
    bad: 'Claim: Hazard analysis is complete for the defined ODD.

      Evidence: Hazard analysis report HAR-03.'
    problem: A reviewer could reasonably ask whether the analysis covered scenarios introduced after the most recent ODD revision, whether the chosen method has known coverage limits for emergent multi-actor interactions, and whether the ODD assumptions still hold. None of these challenges are visible in the argument.
    good: 'Claim: Hazard analysis is complete for the defined ODD.

      Evidence: Hazard analysis report HAR-03.

      Challenge: The analysis may not cover scenarios introduced after the most recent ODD revision.

      Response: Change-impact review CIR-12 confirms newly added scenarios were re-examined.

      Challenge: The chosen method has known coverage limits for emergent multi-actor interactions.

      Response: Supplementary scenario-based analysis SBA-04 addresses that gap.'
  references:
  - source_id: CAE-Review
  - source_id: CAE-Defeaters
  - source_id: RA1205
  - source_id: UL4600
    clauses:
    - 5.3.2.2(a)
    - 5.4.2.2(b)
  - source_id: GSN-v3
  distinguish_from:
  - id: SU.11
    note: Cite SU.11 when a challenge has already been raised, in review or as a challenge element, and is not carried to a visible resolution. Cite SU.1 when a plausible doubt about the claim, reasoning, or evidence has not been raised in the argument at all.
  - id: RD.3
    note: Cite RD.3 when the argument knows a limitation of its support and does not show it where the claim is read. Cite SU.1 when a reviewer can see a doubt the argument has not considered.
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Strategy
    - GSN Solution
    - CAE Claim
    - CAE Argument
    - CAE Evidence
    detection_hints:
    - Look for branches presenting only supporting material with no challenges or responses.
    suggested_checks:
    - id: check-plausible-challenges-addressed
      description: Check whether plausible reviewer challenges to the claim, reasoning, or evidence are visible and addressed.
    repair:
    - action: add_element
      element_role: challenge
      attach_to: selected
      statement: Raise the plausible challenge as an explicit challenge element and resolve it.
- id: SU.2
  category: SU
  title: Make assumptions explicit and justify why they are reasonable
  statement: Do not rely on hidden assumptions. When a claim or reasoning step depends on a condition that must hold, state it explicitly at the point where it constrains the argument, explain why it is reasonable, and ensure it is monitored or otherwise controlled where needed. If the condition should be shown rather than assumed, argue it as a sub-claim instead.
  short_rule: State each assumption where it constrains the argument, justify it, and monitor it where needed.
  rationale: Unstated or weakly founded assumptions are a common cause of later argument invalidation. That aligns well with UL 4600’s treatment of assumptions and lifecycle monitoring. Stating an assumption where it constrains the argument, not only where it was first discovered, lets a reviewer see what each branch depends on. GSN also treats assumptions as a distinct element type, so checking whether something is really an assumption is appropriate.
  review_prompts:
  - What must be true for this branch to hold?
  - Is each dependency stated at the claim or reasoning step it constrains, rather than only elsewhere in the case?
  - Why is this assumption reasonable, and how would we know if it became false?
  - Is this really an assumption, or should it instead be represented as context, a claim, or evidence?
  examples:
    bad: 'Claim: Localization accuracy is acceptable within the defined ODD.

      Hidden assumption (not stated): Map data used at runtime is current.'
    problem: A reviewer cannot judge whether the assumption is reasonable, whether it is monitored, or what would invalidate it. If the assumption fails, the affected claim may silently lose support.
    good: 'Claim: Localization accuracy is acceptable within the defined ODD.

      Assumption: Map data used at runtime is no more than 7 days out of date.

      Justification: Map update process MAP-PROC-02 enforces a 7-day refresh cycle and is monitored by KPI MAP-KPI-01.

      Re-assessment trigger: Sustained KPI breach or change to the map update process.'
  references:
  - source_id: UL4600
    clauses:
    - 5.4.1.3(a)(11)
    - 5.4.2.2(a)(3)
    - 5.4.1.6.2
  - source_id: GSN-v3
    clauses:
    - '0:4.6'
    - 1:2.2.12
    - 1:2.2.17
  distinguish_from:
  - id: AR.6
    note: Cite AR.6 when what is missing is information needed to understand what the claim means. Cite SU.2 when it is a condition that must hold for the claim to be true.
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Strategy
    - GSN Context
    - GSN Assumption
    - CAE Claim
    - CAE Argument
    - CAE Context
    - CAE Assumption
    detection_hints:
    - Look for branches whose validity depends on a condition that is not stated as an assumption or context.
    - Look for a dependency stated elsewhere in the case but not attached to the claim or reasoning step it constrains.
    suggested_checks:
    - id: check-explicit-assumptions
      description: Check whether implicit assumptions are made explicit at the point where they constrain the argument, justified, and monitorable.
    repair:
    - action: add_element
      element_role: assumption
      attach_to: selected
      statement: State the hidden condition explicitly as an assumption where it constrains the argument.
    - action: add_element
      element_role: justification
      attach_to: selected
      statement: Justify why the assumption is reasonable and how it is monitored.
    - action: add_element
      element_role: claim
      attach_to: children
      statement: If the condition must be shown rather than assumed, add it as a sub-claim.
- id: SU.3
  category: SU
  title: Do not rely on uncorroborated expert judgment alone
  statement: Do not rely on expert judgment alone unless its basis, limits, and corroborating support are stated, or the residual uncertainty is monitored over the lifecycle where appropriate.
  short_rule: Do not rest a claim on expert judgment alone; state its basis and corroborate it.
  rationale: Expert opinion may be useful, but unsupported opinion is weak support and can easily outstate what is actually known.
  review_prompts:
  - Is the opinion supported by data, literature, documented analysis, or another explicit technical basis?
  - Is the context of applicability clear and argued?
  - If the opinion remains weakly supported, is lifecycle monitoring in place where needed?
  examples:
    bad: 'Claim: Residual risk is acceptable.

      Evidence: Safety review board statement that residual risk is considered acceptable.'
    problem: Expert judgment is being used as the sole basis for the claim, with no analysis, data, or independent corroboration that a reviewer can examine.
    good: 'Claim: Residual risk is acceptable.

      Evidence:

      - Quantitative risk analysis QRA-09 showing residual risk below the defined threshold.

      - Operational data summary ODS-03 covering 18 months of comparable exposure with no injury-class events.

      Expert review: Safety review board record SRB-2026-04 confirming the analysis method, inputs, and conclusion are consistent with established practice.

      Note: Expert review is corroborating, not substituting for, the underlying analysis and data.'
  references:
  - source_id: UL4600
    clauses:
    - 5.4.2.2(a)(1)
    - 5.4.2.6.3
  - source_id: AVSC-CSE
    clauses:
    - 6.1-6.3
  tool:
    applicable_elements:
    - GSN Solution
    - GSN Justification
    - CAE Evidence
    - CAE Warrant
    detection_hints:
    - Look for evidence consisting only of expert statements without supporting analysis or data.
    markers:
    - kind: uncorroborated_judgment_marker
      effect: candidate
      terms:
      - expert judgment
      - expert judgement
      - expert opinion
      - engineering judgment
      - engineering judgement
      - in the opinion of
      - is considered acceptable
      - board statement
    suggested_checks:
    - id: check-expert-judgment-corroboration
      description: Check whether expert judgment is corroborated by data, analysis, or lifecycle monitoring. Candidate when an uncorroborated judgment marker carries the support with no analysis or data cited alongside it.
    repair:
    - action: add_element
      element_role: evidence
      attach_to: children
      statement: Add the analysis or data that corroborates the judgment.
- id: SU.4
  category: SU
  title: Monitor claims that cannot be fully supported at design time
  statement: When a claim asserts something only operation can confirm, such as a rate, a rarity, or behaviour over the service life, and its support is design-time evidence, state the uncertainty that remains and define lifecycle monitoring and re-assessment triggers that can confirm or challenge the claim during operation.
  short_rule: Where design-time support is partial, say so and define monitoring and re-assessment triggers.
  rationale: Some claims depend partly on assumptions, limited evidence, or expected field behavior. The recognisable shape is a claim about operational frequency, exposure, or service life whose evidence is analysis, test, or simulation done before operation. In such cases, the safety case should not hide the remaining uncertainty. It should explain it and define how operation will provide feedback.
  review_prompts:
  - Does the claim state a rate, a rarity, or behaviour over a service life that only operation can confirm?
  - What part of this claim is not fully supported at design time?
  - Can that remaining uncertainty only be reduced through operational or field data?
  - Is lifecycle monitoring defined for that uncertainty?
  - Are reassessment triggers identified?
  examples:
    bad: 'Claim: Unexpected roadside object class X is sufficiently rare that residual risk is acceptable.

      Evidence: Design-time analysis suggesting object class X is rare.

      Justification: The design-time rarity assumption is treated as fully proven; no operational follow-up is defined.'
    problem: The available data does not fully establish the operational frequency of object class X, but the remaining uncertainty is not made explicit and no lifecycle monitoring is defined to confirm or challenge the claim during operation.
    good: 'Claim: Unexpected roadside object class X is sufficiently rare that residual risk is acceptable.

      Acknowledged uncertainty: The rarity assumption is not fully confirmed at design time.

      Field monitoring: Occurrence of roadside object class X is monitored in operation.

      Reassessment trigger: Observed frequency or associated incidents exceed threshold T.'
  references:
  - source_id: ISO-21448
    clauses:
    - 12.3-12.4
    - 13.1-13.4
  - source_id: UL4600
    clauses:
    - 5.4.2.2(a)
    - 5.4.2.3(c)
  distinguish_from:
  - id: LF.5
    note: Cite LF.5 when more or better design-time evidence could close the gap between the claim and its data. Cite SU.4 when only operational experience can close it, so the claim needs monitoring and re-assessment triggers.
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Assumption
    - CAE Claim
    - CAE Assumption
    detection_hints:
    - Look for claims about rarity, occurrence rate, or service-life behaviour supported only by design-time analysis, test, or simulation.
    - Look for claims with partial design-time support and no defined lifecycle monitoring.
    markers:
    - kind: operational_claim_marker
      effect: candidate
      terms:
      - rare
      - rarely
      - frequency
      - occurrence rate
      - service life
      - lifetime
      - in service
      - in the field
    - kind: monitoring_marker
      effect: suppress
      terms:
      - monitored
      - monitoring
      - field data
      - reassessment
      - re-assessment
      - reassessment trigger
      - re-assessment trigger
    suggested_checks:
    - id: check-lifecycle-monitoring
      description: Check whether claims with residual design-time uncertainty have defined monitoring and reassessment triggers. Candidate when an operational claim marker appears in the claim and no monitoring marker appears in the claim, its assumptions, or its context.
    repair:
    - action: add_element
      element_role: assumption
      attach_to: selected
      statement: State the unconfirmed condition as an assumption with a re-assessment trigger.
    - action: reword_element
      statement: Narrow the claim to what design-time evidence actually supports.
- id: SU.5
  category: SU
  title: Do not reuse safety credit from another context without showing it still applies
  statement: Do not rely on safety credit from proven-in-use technology, legacy technology, COTS, prior assessments, standard conformance, or prior practice unless you show that the original context is sufficiently comparable to the current one.
  short_rule: Show that reused safety credit came from a sufficiently comparable context.
  rationale: Safety confidence gained in one context does not automatically remain valid in another. Differences in operating environment, purpose, interfaces, duty cycle, autonomy role, or assumptions can invalidate the reuse.
  review_prompts:
  - What safety confidence, evidence, or assessment result is being reused from another context?
  - Is the original operating context sufficiently comparable to the current one?
  - Have differences in purpose, environment, interfaces, or assumptions been identified?
  - Have the limitations of the original assessment been stated?
  examples:
    bad: This camera is proven in use and is therefore acceptable for autonomous truck operation.
    problem: The claim takes safety credit from another context (passenger vehicle ADAS use) without showing that the original application, operating conditions, interfaces, and safety role are sufficiently comparable to autonomous heavy truck operation.
    good: 'Claim: Reuse of camera safety credit is justified for the current application.

      Context:

      - Original application: conventional passenger vehicle ADAS use.

      - Current application: autonomous heavy truck operation.

      Justification: Safety credit may only be reused if the original and current contexts are shown to be sufficiently comparable in the aspects that matter to safety.

      Sub-claims:

      - The original and current operating environments are sufficiently comparable.

      - The original and current duty cycles are sufficiently comparable.

      - The original and current interfaces and installation conditions are sufficiently comparable.

      - The original and current safety roles and failure consequences are sufficiently comparable.

      - Any non-comparable differences are addressed by additional evidence or explicit limitations.'
  references:
  - source_id: UL4600
    clauses:
    - 5.3.3.2(c)
    - 5.3.2.2(b)-(c)
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Justification
    - CAE Claim
    - CAE Warrant
    detection_hints:
    - Look for proven-in-use or legacy claims with no comparability argument.
    markers:
    - kind: reuse_marker
      effect: candidate
      terms:
      - proven in use
      - proven-in-use
      - legacy
      - cots
      - off the shelf
      - off-the-shelf
      - previously certified
      - prior assessment
      - previously assessed
    suggested_checks:
    - id: check-context-comparability
      description: Check whether reused safety credit is supported by an explicit comparability argument. Candidate when a reuse marker appears and no comparability argument accompanies it.
    repair:
    - action: add_element
      element_role: claim
      attach_to: children
      statement: Argue comparability of the original and current context as sub-claims.
    - action: add_element
      element_role: justification
      attach_to: selected
      statement: State the basis on which the reused credit is held to apply.
- id: SU.6
  category: SU
  title: Do not dismiss operational feedback because it is non-reproducible or non-injury
  statement: When a claim relies on operational experience, field monitoring, incident history, or proven-in-use style reasoning, do not dismiss incidents, near misses, anomalies, or failure reports merely because they have not recurred, cannot yet be reproduced, or did not lead to harm.
  short_rule: Do not dismiss field anomalies because they caused no injury or could not be reproduced.
  rationale: Operational feedback is often used to support claims about residual risk, rarity, adequacy of existing controls, or continued acceptability in service. In those branches, non-injury or non-reproducibility does not make a signal irrelevant. Several weak signals together may show that the argument is less reliable than it appears.
  review_prompts:
  - Is this branch relying on operational experience or field feedback as part of its support?
  - Are incidents defined broadly enough to include near misses, close calls, and anomalies that could have led to harm?
  - Is adverse operational feedback being screened out too aggressively?
  - Is the argument considering the combined signal from multiple incidents or anomalies?
  - Is adverse operational evidence explicitly recorded, evaluated, and addressed?
  examples:
    bad: 'Claim: Residual risk from unexpected roadside object encounters is acceptable in operation.

      Support: field incident history and operational monitoring.

      Note: Three roadside-object anomalies were reported, but none caused injury and none could be reproduced, so they are not safety-relevant.'
    problem: The argument uses operational feedback but dismisses adverse signals simply because they were non-injury and non-reproducible; together they may indicate the rarity assumption is less reliable than it appears.
    good: 'Claim: Residual risk from unexpected roadside object encounters is acceptable in operation.

      Support: field incident history and operational monitoring.

      Treatment: The three anomalies are recorded, grouped, and evaluated as negative field feedback. The argument explains whether they challenge the rarity assumption, whether they show a gap in object coverage, and whether more analysis or mitigation is needed.'
  references:
  - source_id: RA1205
  - source_id: ONR-SAPs
  - source_id: UL4600
    clauses:
    - 5.3.3.2(d)
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Solution
    - CAE Claim
    - CAE Evidence
    detection_hints:
    - Look for arguments that use operational data and discount non-injury or non-reproducible incidents.
    markers:
    - kind: dismissal_marker
      effect: candidate
      terms:
      - could not be reproduced
      - cannot be reproduced
      - not reproducible
      - no injury
      - non-injury
      - not safety-relevant
      - one-off
      - isolated incident
    suggested_checks:
    - id: check-operational-feedback-treatment
      description: Check whether adverse operational feedback is recorded, grouped, and evaluated rather than silently dismissed. Candidate when a dismissal marker appears in a branch that relies on operational experience.
    repair:
    - action: add_element
      element_role: justification
      attach_to: selected
      statement: Record and evaluate the adverse operational feedback rather than dismissing it.
- id: SU.7
  category: SU
  title: Do not argue low risk from operational experience or unvalidated simulation alone
  statement: Do not infer low risk for a known hazard solely from uneventful operational history or from simulation whose credibility for the claim has not been demonstrated.
  short_rule: Do not infer low risk from uneventful operation or unvalidated simulation alone.
  rationale: Operational exposure can miss catastrophic but rare outcomes. Simulation can miss modeling defects and abstraction errors.
  review_prompts:
  - Is simulation alone being treated as enough to show low risk?
  - Is operational history alone being treated as enough to show low risk?
  - Has simulation validity for this claim not been shown?
  - Are corroborating evidence, scenario limits, or model limitations missing?
  examples:
    bad: 'Claim: Collision risk with cut-in vehicles is low.

      Evidence: Simulation results SIM-12.

      Justification: No collisions were observed in the simulation results, therefore the risk is low.'
    problem: The branch treats simulation results alone as sufficient proof that risk is low, without showing that the simulation is valid for this claim, that the modeled scenarios are adequate, or that important model limitations are understood.
    good: 'Claim: Collision risk with cut-in vehicles is acceptably low.

      Evidence:

      - Simulation results SIM-12.

      - Track test report TR-08.

      - Field incident review FR-03.

      Argument: Why SIM-12 is valid for this hazard and what scenario space it covers; what limitations remain in the simulation model; how TR-08 corroborates important behaviors in representative test conditions; how FR-03 is used to check whether operational experience challenges the claim.'
  references:
  - source_id: UNECE-ADS
  - source_id: ISO-21448
  - source_id: UL4600
    clauses:
    - 5.3.3.2(i)-(j)
    - 5.4.2.1(c)
  tool:
    applicable_elements:
    - GSN Solution
    - GSN Justification
    - CAE Evidence
    - CAE Warrant
    detection_hints:
    - Look for low-risk claims supported only by simulation or only by uneventful operational time.
    suggested_checks:
    - id: check-low-risk-evidence-mix
      description: Check whether low-risk claims combine multiple corroborating evidence types and address simulation validity.
    repair:
    - action: add_element
      element_role: evidence
      attach_to: children
      statement: Add corroborating evidence of a different type.
    - action: add_element
      element_role: justification
      attach_to: selected
      statement: Argue why the simulation or operational basis is valid for this claim.
- id: SU.8
  category: SU
  title: Do not assume human data or human-designed tests cover autonomy-specific failures
  statement: Do not assume that human-operated data sets or human-designed test plans are sufficient to cover autonomy-specific failures or edge cases.
  short_rule: Do not assume human-derived data or human-designed tests cover autonomy-specific failures.
  rationale: Autonomous systems can encounter operating situations and failure combinations that are uncommon in human driving. Human-derived data and human-designed tests may therefore miss important autonomy-specific risks.
  review_prompts:
  - Is the claim supported mainly by human-operated data or human-designed tests?
  - Could the autonomous system encounter situations or create hazards that are uncommon in human driving?
  - Are autonomy-specific failure modes and edge cases explicitly considered?
  - Is there evidence that the test basis covers autonomy-specific failures, not only human-driving situations?
  examples:
    bad: 'Claim: Planning failure modes are adequately covered by the test set.

      Evidence: Scenario Selection Report SSR-04.

      Justification: The scenario set is based on human-driven fleet data and therefore covers relevant road situations.'
    problem: The branch assumes that human-driven data is enough to cover planning failures, but the autonomous planner may enter unusual states or produce behaviors that human drivers would not normally create.
    good: 'Claim: Planning failure modes are adequately covered by the test set.

      Evidence:

      - Scenario Selection Report SSR-04.

      - Planner Failure Analysis Report PFA-03.

      - Edge Case Test Specification ETS-07.

      Justification: Coverage is based not only on human-driven scenarios, but also on autonomy-specific planner failure analysis and identified edge cases.'
  references:
  - source_id: ISO-21448
    clauses:
    - 7.1-7.4
    - 9.1-9.3
    - 10-11
  - source_id: UL4600
    clauses:
    - 5.3.3.2(e)
    - 5.3.3.2(g)
    - 5.4.2.2(b)
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Solution
    - CAE Claim
    - CAE Evidence
    detection_hints:
    - Look for claims about autonomy coverage backed only by human-driven datasets or human-designed scenarios.
    suggested_checks:
    - id: check-autonomy-coverage
      description: Check whether the test basis covers autonomy-specific failure modes and edge cases.
    repair:
    - action: add_element
      element_role: evidence
      attach_to: children
      statement: Add evidence covering autonomy-specific failure modes and edge cases.
- id: SU.10
  category: SU
  title: Keep assumptions bounded, specific, and monitorable
  statement: Do not use assumptions that are broader than the claim scope or so vague that they cannot be checked, challenged, or monitored.
  short_rule: Keep each assumption narrow, specific, and monitorable, and split ones that bundle dependencies.
  rationale: Over-broad assumptions can make a claim appear closed while removing most of its review value. If an argument depends on an assumption, the assumption should be narrow enough to understand, evaluate, and monitor where needed.
  review_prompts:
  - Is the assumption matched to the scope of the claim it constrains?
  - Can the assumption be checked, challenged, or monitored?
  - Does the assumption hide several different dependencies that should be separated?
  - Would the branch become clearer if the assumption were narrowed or split?
  examples:
    bad: 'Claim: Traffic signal interpretation is sufficiently reliable for safe intersection handling.

      Assumption: Infrastructure behaves correctly.'
    problem: The assumption is too broad; it does not identify which infrastructure, which behaviors, which authorities, or what kinds of failure are being assumed away, so it cannot be checked, challenged, or monitored.
    good: 'Claim: Traffic signal interpretation is sufficiently reliable for safe intersection handling.

      Assumption: Within the defined ODD, traffic signals managed by the identified road authorities are assumed to conform to the referenced control standard.

      Monitoring: Violations are tracked through field feedback and incident analysis.


      Or, if several dependencies are involved, split into multiple assumptions:

      - Traffic signal installations in the defined ODD conform to the referenced control standard.

      - Detected traffic signal anomalies are captured through field feedback.'
  references:
  - source_id: UL4600
    clauses:
    - 5.4.2.2(a)(3)
    - 10.5.1.2(b),(h)
    - 12.5.1.2(c)(1)
    - 12.5.2.2(b)
  - source_id: GSN-v3
    clauses:
    - 1:2.2.12
    - 1:2.2.17
  tool:
    applicable_elements:
    - GSN Assumption
    - CAE Assumption
    detection_hints:
    - Look for assumptions that are vague, universal, or unmonitorable.
    markers:
    - kind: unbounded_assumption_marker
      effect: candidate
      terms:
      - behaves correctly
      - works as intended
      - functions properly
      - is correct
      - is reliable
      - as expected
      - operates normally
    suggested_checks:
    - id: check-assumption-bounded
      description: Check whether each assumption is narrow, specific, and monitorable where needed. Candidate when an unbounded assumption marker appears with no stated scope, threshold, or monitoring.
    repair:
    - action: split_element
      statement: Split an assumption that bundles several dependencies into one assumption each.
    - action: reword_element
      statement: Narrow the assumption to something that can be checked, challenged, or monitored.
- id: SU.11
  category: SU
  title: Make plausible reviewer challenges explicit and resolve them
  statement: When review raises a plausible What if X? challenge, make that challenge explicit and resolve it visibly in the safety case. Depending on the method, this may be represented as a GSN Counter Claim, a CAE defeater, or another explicit challenge element. The resolution may reject the challenge, narrow or revise the original claim, add supporting evidence, introduce assumptions and monitoring, or leave a visible open issue if the matter is not yet resolved.
  short_rule: Raise a plausible reviewer challenge as an explicit element and resolve it visibly.
  rationale: A credible safety case should not leave plausible challenges only in review comments or reviewer intuition. Good reviews expose weaknesses early. Making the challenge explicit helps ensure that it is either resolved properly or left visible until it is resolved.
  review_prompts:
  - What exactly is the reviewer challenge?
  - Should this challenge be made explicit as a Counter Claim, defeater, or other challenge element?
  - Has the challenge been rejected, sustained, or left unresolved?
  - If sustained, has the original branch been updated appropriately?
  - If unresolved, is the open issue visible and traceable?
  examples:
    bad: 'Initial branch:

      Claim: Fallback behavior is acceptably safe.

      Reviewer challenge raised informally: What if localization drops out during fallback?

      The challenge is not promoted into the safety case and remains in review notes only.'
    problem: A plausible reviewer challenge has been left in review comments and reviewer intuition rather than made explicit in the safety case, so it cannot be tracked, resolved, or shown as an open issue.
    good: 'Make the challenge explicit:

      Challenge: Fallback behavior may not be acceptably safe if localization drops out during fallback.

      Representation: In GSN this may be shown as a Counter Claim; in CAE this may be shown as a defeater.

      Status: Undeveloped (while analysis is ongoing).


      Possible resolutions:

      - Challenge rejected: Add evidence (Fallback localization analysis FLA-04, Fallback test report FTR-09); claim retained.

      - Challenge sustained: Narrow the claim to "Fallback behavior is acceptably safe under conditions with validated localization continuity."

      - Challenge partly sustained: Add dependency "Localization continuity is maintained during fallback" plus monitoring of continuity violations.

      - Not yet resolved: Open Issue "Impact of localization dropout during fallback remains unresolved and requires additional analysis."'
  references:
  - source_id: CAE-Review
  - source_id: CAE-Defeaters
  - source_id: RA1205
  - source_id: UL4600
    clauses:
    - 5.3.2.2(a)
    - 5.3.2.3(c)(1)-(2)
    - 5.4.2.2(b)
    - 5.4.2.3(a)
  - source_id: GSN-v3
  distinguish_from:
  - id: SU.1
    note: Cite SU.1 when a plausible doubt has not been raised in the argument at all. Cite SU.11 when a challenge has been raised, in review or as a challenge element, and is not carried to a visible resolution.
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Counter Claim
    - CAE Claim
    - CAE Defeater
    detection_hints:
    - Look for plausible reviewer challenges that have not been promoted into the safety case.
    suggested_checks:
    - id: check-counter-claims-resolved
      description: Check whether plausible reviewer challenges are made explicit and visibly resolved.
    repair:
    - action: add_element
      element_role: challenge
      attach_to: selected
      statement: Raise the reviewer challenge as a counter claim or defeater in the argument.
    - action: reword_element
      statement: If the challenge is sustained, narrow the claim to what still holds.
- id: LF.1
  category: LF
  title: Avoid circular reasoning
  statement: Do not support a claim by restating it, renaming it, or assuming it in the support.
  short_rule: Support a claim with independent grounds, never by restating or renaming it.
  rationale: Circular support creates the appearance of argument without adding any new support.
  review_prompts:
  - Would the support still work if the parent claim were not assumed true?
  - Is the same conclusion being repeated with different words?
  examples:
    bad: The system is acceptably safe because the safety case shows acceptable safety.
    problem: The support restates the claim using different words; it provides no independent grounds for the conclusion.
    good: The system is acceptably safe because hazards H1-H12 are mitigated by controls C1-C8, and the controls are verified by reports VR-01 to VR-08 against acceptance criteria AC-01 to AC-12.
  references:
  - source_id: Greenwell-2006
  - source_id: UL4600
    clauses:
    - 5.3.3.1(a)
    - 5.3.3.2(a)
    - 5.3.3
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Strategy
    - CAE Claim
    - CAE Argument
    detection_hints:
    - Look for support that restates or renames the parent claim.
    suggested_checks:
    - id: check-circular-support
      description: Check whether support adds independent reasoning or merely restates the claim.
    repair:
    - action: add_element
      element_role: claim
      attach_to: children
      statement: Replace the restatement with support that does not assume the claim.
- id: LF.2
  category: LF
  title: Avoid irrelevant premises
  statement: Do not use evidence or supporting statements that may be true but do not support the immediate claim being made.
  short_rule: Attach evidence to the exact claim it supports, not to a neighbouring one.
  rationale: A common defect is to attach true or relevant material to the wrong claim, so the branch appears supported even though the actual inference is missing.
  review_prompts:
  - Does this evidence support this exact claim?
  - Is the evidence only relevant to a different or neighboring claim?
  - Is the missing support actually a different intermediate claim that has not been stated?
  examples:
    bad: 'Claim: Brake fault handling is acceptable.

      Evidence: Brake fault handling requirements are documented.'
    problem: Documented requirements may be necessary, but they do not by themselves show that brake fault handling is acceptable; the inferential link between requirements existing and acceptable fault handling is missing.
    good: 'Claim: Brake fault handling is acceptable.

      Sub-claims:

      - Brake fault handling requirements are correctly defined.

      - Implemented brake fault handling satisfies the defined requirements.

      Evidence:

      - Brake fault handling requirements specification BRS-04.

      - Brake fault handling verification report BVR-09.'
  references:
  - source_id: Greenwell-2006
  - source_id: UL4600
    clauses:
    - 5.3.3.1(a)
    - 5.3.3.2(a)
    - 5.3.2.1(a)(1)
  tool:
    applicable_elements:
    - GSN Solution
    - GSN Goal
    - CAE Evidence
    - CAE Claim
    detection_hints:
    - Look for evidence whose actual scope supports a different claim than the one it is attached to.
    suggested_checks:
    - id: check-evidence-relevance
      description: Check whether each evidence item supports the immediate claim it is attached to.
    repair:
    - action: add_element
      element_role: claim
      attach_to: children
      statement: Add the intermediate claim that the cited evidence actually supports.
- id: LF.3
  category: LF
  title: Avoid arguing from ignorance
  statement: Do not treat lack of discovered evidence against a claim as positive evidence for the claim.
  short_rule: 'Do not argue from absence: nothing found is not evidence that nothing exists.'
  rationale: Not finding a problem is not the same as showing that the problem does not exist. Claims about completeness or absence need support from the search basis, scope, and adequacy of the methods used.
  review_prompts:
  - Is not found being treated as does not exist?
  - Is the claim really about completeness of the search, rather than absolute absence?
  - Was the search for contrary evidence demonstrably adequate for the stated scope?
  examples:
    bad: 'Claim: No other credible hazards exist.

      Evidence: HARA report HAR-03.

      Justification: The HARA identified all relevant hazards, and no further hazards were found.'
    problem: The branch treats absence of newly discovered hazards as proof that no other credible hazards exist, rather than as a bounded completeness claim about the search.
    good: 'Claim: Hazard identification is sufficiently complete for the defined scope.

      Context: Applies to the defined item, ODD, and lifecycle scope.

      Evidence:

      - HARA report HAR-03.

      - STPA report STP-02.

      - Hazard review record HRR-07.

      Justification: Complementary hazard identification methods and review coverage have been applied for the defined scope.'
  references:
  - source_id: Greenwell-2006
  - source_id: UL4600
    clauses:
    - 5.3.3.1(a)
    - 5.3.3.2(a)
    - 5.4.2.3(a)
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Justification
    - CAE Claim
    - CAE Warrant
    detection_hints:
    - Look for completeness or absence claims justified only by absence-of-finding.
    markers:
    - kind: absence_phrase
      effect: candidate
      terms:
      - no evidence of
      - no failures observed
      - no issues found
      - none were found
      - no further
      - not found
      - no known
      - no reported
    suggested_checks:
    - id: check-completeness-vs-absence
      description: Check whether absence-based claims are reframed as bounded completeness claims with adequate search coverage. Candidate when an absence phrase carries the support for a completeness claim.
    repair:
    - action: reword_element
      statement: Restate the claim as a bounded completeness claim about the search that was performed.
    - action: add_element
      element_role: evidence
      attach_to: children
      statement: Cite the search basis, methods, and coverage as evidence.
- id: LF.4
  category: LF
  title: Avoid unjustified comparison or unjustified distinction
  statement: Do not claim that one case is equivalent to, safer than, better than, or different from another unless the basis of comparison or distinction is explicit and relevant to the claim being made.
  short_rule: State the basis of any comparison or distinction, and show the cases are matched.
  rationale: Comparison-based arguments can look persuasive while hiding differences in scope, operating conditions, metrics, evidence quality, or confidence. Distinctions can also be misused to dismiss relevant comparators without showing why the difference matters.
  review_prompts:
  - What exactly is being compared or distinguished?
  - Is the basis of comparison or distinction explicit?
  - Are the compared cases matched in scope, operating conditions, metrics, and confidence level?
  - If a difference is claimed, is it shown why that difference matters to the argument?
  examples:
    bad: 'Claim: The autonomous vehicle is safer than a human driver.

      Evidence: Simulation report SIM-09.

      Justification: The autonomous vehicle had fewer simulated collisions than the human-driver baseline.'
    problem: The comparison may be unjustified if the simulation conditions, scenario coverage, driver model, metrics, and confidence are not shown to be appropriate and comparable.
    good: 'Claim: For the defined ODD and stated comparison metric, the autonomous vehicle has lower collision rate than the specified human-driver baseline.

      Context: Comparison applies to ODD-A, metric M1, and baseline definition BD-02.

      Evidence:

      - Simulation report SIM-09.

      - Baseline comparison report BCR-03.

      - Scenario validity report SVR-04.

      Justification: The compared cases use matched scope, scenarios, metrics, and confidence basis.'
  references:
  - source_id: Greenwell-2006
  - source_id: UL4600
    clauses:
    - 5.3.3.1(a)
    - 5.3.3.2(a)
    - 5.3.3.2(c)
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Justification
    - CAE Claim
    - CAE Warrant
    detection_hints:
    - Look for safer-than or different-from claims without an explicit basis of comparison.
    markers:
    - kind: comparison_marker
      effect: candidate
      terms:
      - safer than
      - better than
      - equivalent to
      - comparable to
      - superior to
      - at least as safe as
      - unlike
      - different from
    suggested_checks:
    - id: check-comparison-basis
      description: Check whether comparisons or distinctions are matched in scope, conditions, metrics, and confidence. Candidate when a comparison marker appears and no basis of comparison is stated in context or justification.
    repair:
    - action: add_element
      element_role: context
      attach_to: selected
      statement: State the basis of comparison as context on the claim.
    - action: add_element
      element_role: justification
      attach_to: selected
      statement: Argue why the compared cases are matched in scope, metric, and confidence.
- id: LF.5
  category: LF
  title: Avoid sample-size and representativeness fallacies
  statement: Do not generalize too far from too little data, or from data that does not match the operating context being claimed.
  short_rule: Keep the claim no broader than the sample size and representativeness support.
  rationale: A small or skewed data set can support only a correspondingly narrow claim.
  review_prompts:
  - Is the sample size adequate for the confidence implied?
  - Does the data distribution match the ODD and edge cases?
  - Is the claim broader than the sample supports?
  - Does the evidence cover the conditions the claim names, or is a kind of evidence a critical reviewer would expect for those conditions absent?
  examples:
    bad: 'Claim: The item is acceptably safe across the defined ODD.

      Evidence: Road test report RTR-05 covering 12 daylight highway runs in dry conditions.

      Justification: No safety-critical events were observed during testing.'
    problem: The claim covers the full ODD, but the evidence covers only a small and narrow subset of operating conditions; the sample is too limited in size and representativeness to support the broader claim.
    good: 'Either narrow the claim:

      Claim: The item is acceptably safe for the tested daytime highway subset of the ODD.

      Context: Applies only to dry daytime highway operation under the conditions covered in RTR-05.

      Evidence: Road test report RTR-05.


      Or expand the evidence to match the broader claim:

      Claim: The item is acceptably safe across the defined ODD.

      Evidence:

      - Road test report RTR-05.

      - Night and weather test report NWT-03.

      - Scenario coverage analysis SCA-04.

      - Edge-case test report ETR-02.

      Justification: The combined evidence set provides coverage across the claimed ODD, including relevant distributions and edge cases.'
  references:
  - source_id: Greenwell-2006
  distinguish_from:
  - id: SU.4
    note: Cite SU.4 when only operational experience can close the gap, so the claim needs monitoring and re-assessment triggers. Cite LF.5 when more or better design-time evidence could close it.
  - id: LF.7
    note: Cite LF.7 when the case contains unfavourable results or anomalies that the argument leaves unanswered. Cite LF.5 when the evidence is favourable but too narrow, or of the wrong kind, for the breadth of the claim.
  - id: EV.5
    note: Cite EV.5 when the argument does not state what makes its evidence sufficient. Cite LF.5 when it does, or the evidence shows it, and the sample is too small or unrepresentative for the claim.
  tool:
    applicable_elements:
    - GSN Solution
    - GSN Goal
    - CAE Evidence
    - CAE Claim
    detection_hints:
    - Look for broad claims supported by narrow or small data sets.
    suggested_checks:
    - id: check-sample-coverage
      description: Check whether sample size and representativeness match the breadth of the claim.
    repair:
    - action: reword_element
      statement: Narrow the claim to the conditions the sample actually covers.
    - action: add_element
      element_role: evidence
      attach_to: children
      statement: Or extend the evidence set to cover the breadth the claim states.
- id: LF.6
  category: LF
  title: Avoid pseudo-precision
  statement: Do not present numerical precision beyond what the evidence, model, assumptions, or method can justify.
  short_rule: State numbers only to the precision the model, data, and assumptions justify.
  rationale: A highly precise number can give a false impression of certainty. When uncertainty, confidence, model limits, or input assumptions are weak, the stated precision should reflect that.
  review_prompts:
  - Does the number imply a level of certainty the method cannot support?
  - Are uncertainty, assumptions, and confidence bounds stated where needed?
  - Is the stated precision greater than the quality of the underlying evidence or model?
  - Would a rounded value or bounded statement better reflect the real knowledge state?
  examples:
    bad: 'Claim: Residual collision risk is 3.742 x 10^-7 per hour.

      Evidence: Quantitative risk analysis report QRA-05.'
    problem: The stated value suggests a level of certainty that may not be justified by the model assumptions, input data quality, scenario coverage, or confidence bounds.
    good: 'Claim: Residual collision risk is below the accepted threshold for the defined operating conditions.

      Context: Applies under the assumptions and scenario scope defined in QRA-05.

      Evidence: Quantitative risk analysis report QRA-05.

      Justification: The result is reported with precision consistent with model uncertainty and stated confidence.


      Or, where a numeric claim is still appropriate:

      Claim: Residual collision risk is estimated to be on the order of 10^-7 per hour for the defined operating conditions.

      Context: Estimate is subject to the assumptions, uncertainty, and confidence limits stated in QRA-05.

      Evidence: Quantitative risk analysis report QRA-05.'
  references:
  - source_id: Greenwell-2006
  tool:
    applicable_elements:
    - GSN Goal
    - CAE Claim
    detection_hints:
    - Look for many-significant-digit numerical claims without uncertainty or confidence statement.
    markers:
    - kind: uncertainty_marker
      effect: suppress
      terms:
      - approximately
      - on the order of
      - estimated
      - uncertainty
      - confidence
      - bound
      - range
      - interval
    thresholds:
    - id: significant_digits
      value: 3
      unit: digits
      note: A risk or performance figure stated to more significant digits than this, with no stated uncertainty, is a candidate signal.
    suggested_checks:
    - id: check-stated-precision
      description: Check whether numerical precision is consistent with model and data uncertainty. Candidate when a figure carries more significant digits than the published threshold and no uncertainty marker accompanies it.
    repair:
    - action: reword_element
      statement: State the figure to the precision the method supports, with its uncertainty or confidence bound.
- id: LF.7
  category: LF
  title: Avoid cherry-picking and ignoring counter-evidence
  statement: Do not present only the favourable part of the evidence. Where the cited evidence, its stated limitations, or other material in the case contains unfavourable results, failures, or anomalies relevant to the claim, answer them in the argument, by explaining why they do not undermine the claim, narrowing the claim, or adding support.
  short_rule: Do not cite only favourable results; answer the unfavourable results the case contains.
  rationale: A safety case becomes misleading when it presents only the supporting part of its evidence and leaves unanswered the results that could weaken, limit, or challenge the claim. The recognisable shape is a result or statement in the case that runs against the claim, with nothing in the argument responding to it, or evidence cited as a selected subset of a larger result set. Evidence that is favourable but too narrow for the claim is LF.5.
  review_prompts:
  - Does the case contain results, failures, exclusions, or anomalies that run against this claim?
  - Is the evidence cited selectively, for example only the passing runs or a chosen subset?
  - Is each unfavourable result answered, by explanation, a narrower claim, or added support?
  - Would the claim still read the same way if the unfavourable results were placed next to it?
  examples:
    bad: 'Claim: Emergency braking stopping distance meets acceptance criterion AC-BRK-04.

      Evidence: Braking test report BTR-06, section 4, passing runs.

      The same report, section 5, records three low-friction runs in which stopping distance exceeded AC-BRK-04.'
    problem: The argument cites the favourable runs and leaves unanswered the failing runs recorded in the same report; a reviewer is left to discover that the evidence partly contradicts the claim.
    good: 'Claim: Emergency braking stopping distance meets acceptance criterion AC-BRK-04 on dry and wet surfaces.

      Evidence: Braking test report BTR-06, sections 4 and 5, all runs.

      Context: Claim excludes low-friction surfaces, where three runs in BTR-06 section 5 exceeded AC-BRK-04.

      Open issue: Low-friction braking is argued in the separate branch for friction-limited operation.


      Or, if the failing runs are explained rather than excluded:

      Justification: The three low-friction runs in BTR-06 section 5 used a tyre set outside the vehicle specification; repeat runs with specified tyres, BTR-07 section 2, meet AC-BRK-04.'
  references:
  - source_id: Greenwell-2006
  distinguish_from:
  - id: LF.5
    note: Cite LF.5 when the evidence is favourable but too narrow, or of the wrong kind, for the breadth of the claim. Cite LF.7 when the case contains unfavourable results that the argument leaves unanswered.
  - id: SU.6
    note: Cite SU.6 when the unanswered material is operational feedback dismissed because it caused no harm or could not be reproduced. Cite LF.7 for other unfavourable results.
  - id: SU.11
    note: Cite SU.11 when the unanswered material is a raised challenge, such as a counter claim or defeater. Cite LF.7 when it is an unfavourable result in the evidence.
  tool:
    applicable_elements:
    - GSN Solution
    - GSN Goal
    - CAE Evidence
    - CAE Claim
    detection_hints:
    - Look for evidence cited as a selected or passing subset of a larger result set.
    - Look for unfavourable results, failures, or anomalies stated in the case with no response in the argument.
    markers:
    - kind: selective_citation_marker
      effect: candidate
      terms:
      - passing runs
      - successful runs
      - selected runs
      - selected results
      - representative runs
      - representative results
      - typical results
      - best-case
      - best case
      - excluding outliers
      - outliers removed
    suggested_checks:
    - id: check-counter-evidence-treatment
      description: Check whether unfavourable results in the case are answered and whether evidence is cited selectively. Candidate when a selective citation marker appears in an evidence reference.
    repair:
    - action: reword_element
      statement: Cite the full result set, not only its favourable part.
    - action: add_element
      element_role: justification
      attach_to: selected
      statement: Answer each unfavourable result, explaining why it does not undermine the claim or what does address it.
    - action: reword_element
      statement: Or narrow the claim so that the unfavourable conditions are outside its scope.
- id: RD.1
  category: RD
  title: Use explicit signposting of argument element roles
  statement: Make it clear whether a statement is functioning as a claim, evidence reference, context, assumption, or justification.
  short_rule: Signpost each element's role in its wording so no reader has to guess what it does.
  rationale: Review becomes harder when the reader must infer the role of a statement. Clear signposting reduces confusion between argument elements and makes the structure easier to inspect.
  review_prompts:
  - Is the reader forced to infer the role of the statement?
  - Are claims, context, assumptions, and justifications mixed together?
  - Is evidence clearly identifiable as evidence rather than explanation or claim text?
  examples:
    bad: The braking controller is safe in automated mode with valid localization because tests passed.
    problem: The sentence mixes claim, context, assumption, and evidential reasoning in one statement; the reader must infer the role of each part.
    good: 'Claim: Braking controller safety is acceptable.

      Scope: Applies in automated mode.

      Dependency: Valid localization is available.

      Evidence: Brake controller verification report BVR-09.

      Reasoning: The cited verification evidence is relevant to the defined operating conditions.'
  references:
  - source_id: UL4600
    clauses:
    - 5.3.3.1(b)
    - 5.3.3.2(b)
  - source_id: GSN-v3
    clauses:
    - 1:2.2.10-1:2.2.19
    - 1:2.3.2-1:2.3.6
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Context
    - GSN Assumption
    - GSN Solution
    - GSN Justification
    - CAE Claim
    - CAE Context
    - CAE Assumption
    - CAE Evidence
    - CAE Warrant
    detection_hints:
    - Look for prose statements that mix claim, context, assumption, and evidence in one sentence.
    markers:
    - kind: inference_connective
      effect: candidate
      terms:
      - because
      - therefore
      - hence
      - thus
      - so that
      - since
      - as a result
    suggested_checks:
    - id: check-element-signposting
      description: Check whether each statement is clearly signposted with its argument element role. Candidate when an inference connective appears inside claim text, which signals reasoning that the structure should carry.
    repair:
    - action: move_text
      statement: Split the statement so that each part sits in the element whose role it plays.
- id: RD.2
  category: RD
  title: Use qualified confidence language
  statement: Use confidence language that reflects the actual support and any open issues, not absolute assurance.
  short_rule: Match confidence language to the actual support; do not word a claim as absolute assurance.
  rationale: Safety cases should communicate justified confidence, not absolute assurance when support is partial, bounded, or still open in some respects. This guideline is about how confident the wording is; a claim whose scope is stated nowhere in the branch, neither in the claim nor in its context, is AR.6, and scope written into the claim text is AR.7.
  review_prompts:
  - Does the wording claim more certainty than the support gives?
  - Does the wording overstate closure while issues remain open?
  - Does the confidence language match the actual support?
  examples:
    bad: The item is safe.
    problem: The claim uses absolute confidence language; it overstates closure and hides any unresolved uncertainty.
    good: 'Claim: The item is acceptably safe.

      Context: Daytime urban operation in ODD-A; acceptably safe means residual risk meets acceptance criterion AC-01.

      Assumptions: A1-A4.

      Open issue: OI-03, night rain behaviour, is not yet closed.'
  references:
  - source_id: UL4600
    clauses:
    - 5.3.3.1(b)
    - 5.3.3.2(b)
    - 5.2.3.3(d)
  distinguish_from:
  - id: AR.6
    note: Cite AR.6 when the branch states the claim's scope nowhere, neither in the claim nor in its context. Cite RD.2 when the wording claims more certainty than the support gives, wherever the scope is stated.
  tool:
    applicable_elements:
    - GSN Goal
    - CAE Claim
    detection_hints:
    - Look for claims using absolute confidence language (is safe, is correct).
    markers:
    - kind: absolute_confidence_marker
      effect: candidate
      terms:
      - is safe
      - is correct
      - is complete
      - fully
      - entirely
      - guarantees
      - ensures
      - proves
      - no risk
    suggested_checks:
    - id: check-scope-and-confidence-language
      description: Check whether claims use confidence language matched to actual support. Candidate when an absolute confidence marker appears in claim text. Whether the claim states its scope is AR.6, not this check.
    repair:
    - action: reword_element
      statement: Match the confidence wording to the actual support, and keep open issues visible rather than wording the claim as closed.
- id: RD.3
  category: RD
  title: Keep known limitations visible where the claim is read
  statement: Make known limitations of a claim's support, such as excluded conditions, partial coverage, and open issues, visible at the claim they qualify, through its wording, its context, or an explicit open issue. Do not leave them only in appendices, footnotes, or text that is not connected to the claim.
  short_rule: Show known limitations where the claim is read, not only in appendices or distant text.
  rationale: A claim can appear stronger or broader than the argument supports when its known limits are easy to miss. A safety case is easier to review and trust when it shows not only supporting material but the limits that affect confidence in the claim, at the point where the claim is read. This guideline is about limitations the argument already knows; a doubt the argument has not considered is SU.1, and a condition the claim depends on is an assumption under SU.2.
  review_prompts:
  - Are known limitations, exclusions, or open issues visible at the claim they qualify?
  - Is a limitation stated only in an appendix, a footnote, or text that is not attached to the claim?
  - Would a reviewer reading only the main branch be misled about the claim's scope?
  - Is unresolved doubt made visible through a narrower claim, context, monitoring, or an open issue?
  examples:
    bad: 'Claim: Perception robustness is acceptable.

      Evidence: Perception validation report PVR-08.

      A later appendix states that the reported results exclude heavy rain, dense fog, and severe occlusion.'
    problem: The main claim appears broad, but important limiting conditions are only visible outside the main branch; a reviewer reading only the claim would be misled about its scope.
    good: 'Claim: Perception robustness is acceptable for the validated visibility conditions.

      Context: Claim excludes heavy rain, dense fog, and severe occlusion beyond the tested range defined in PVR-08.

      Evidence: Perception validation report PVR-08.

      Open issue: Robustness under severe occlusion remains unresolved and requires additional evidence.'
  references:
  - source_id: CAE-Review
  - source_id: CAE-Defeaters
  - source_id: RA1205
  - source_id: ONR
  - source_id: EASA
  - source_id: UNECE-ADS
  distinguish_from:
  - id: AR.6
    note: Cite AR.6 when what is missing is the subject, meaning, or scope of the claim itself. Cite RD.3 when it is a known limit of the support or its coverage.
  - id: SU.1
    note: Cite SU.1 when a reviewer can see a doubt the argument has not considered. Cite RD.3 when the argument knows a limitation and does not show it where the claim is read.
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Context
    - CAE Claim
    - CAE Context
    detection_hints:
    - Look for limiting conditions stated only in appendices, footnotes, or distant free text.
    - Look for claims with no visible limitation, exclusion, or open issue although the branch shows only partial coverage.
    markers:
    - kind: distant_location_marker
      effect: candidate
      terms:
      - appendix
      - annex
      - footnote
      - attachment
      - elsewhere in the document
      - see also
    suggested_checks:
    - id: check-limitations-visible
      description: Check whether known limitations are visible at the claim they qualify. Candidate when a limitation is stated only where a distant location marker points, rather than attached to the claim it qualifies.
    repair:
    - action: move_text
      element_role: context
      statement: Move the buried limitation into context attached to the claim it qualifies.
    - action: add_element
      element_role: context
      attach_to: selected
      statement: State the limitation as context where the claim is read.
    - action: reword_element
      statement: Or narrow the claim so that the limitation is outside its scope.
- id: RD.4
  category: RD
  title: Avoid promotional and inflated language
  statement: Do not use promotional, boastful, or image-enhancing language in the safety case.
  short_rule: Use no promotional language; persuade through structure and evidence.
  rationale: Safety arguments should build confidence through explicit claims, reasoning, and evidence, not through language intended to impress the reader.
  review_prompts:
  - Does the wording sound promotional rather than argumentative?
  - Would the sentence lose nothing important if the praise-like wording were removed?
  - Is the wording trying to create confidence through tone rather than support?
  examples:
    bad: A world-class, cutting-edge safety architecture delivers outstanding assurance.
    problem: The wording uses promotional adjectives intended to impress the reader rather than to make a reviewable claim; removing the promotional language would lose nothing argumentative.
    good: The architecture prevents hazardous actuation for fault classes F1-F4 under assumptions A1-A3.
  references:
  - source_id: CAE
  - source_id: OMG-SACM
  - source_id: EASA
  - source_id: RA1205
  tool:
    applicable_elements:
    - GSN Goal
    - CAE Claim
    detection_hints:
    - Look for promotional adjectives such as world-class, cutting-edge, outstanding, best-in-class.
    markers:
    - kind: promotional_term
      effect: candidate
      terms:
      - world-class
      - cutting-edge
      - state-of-the-art
      - best-in-class
      - outstanding
      - excellent
      - unparalleled
      - industry-leading
      - market-leading
      - superior
    suggested_checks:
    - id: check-promotional-language
      description: Check whether claims use promotional or image-enhancing language. Candidate when a promotional term appears in any element text.
    repair:
    - action: reword_element
      statement: Remove the promotional wording and state what is achieved, for what, under which conditions.
- id: RD.5
  category: RD
  title: Avoid passive voice when it hides agency
  statement: Do not use passive wording when the identity of the actor matters to understanding, reviewing, or challenging the argument.
  short_rule: Name the actor who performed a review, judgment, or approval.
  rationale: When a review, judgment, approval, or decision is stated without naming who performed it, accountability becomes harder to inspect and challenge.
  review_prompts:
  - Who performed the review, judgment, or approval?
  - Does the wording hide who is responsible?
  - Would naming the actor improve traceability or auditability?
  examples:
    bad: It was determined that the claim is adequately supported.
    problem: The passive wording hides who performed the determination; the reviewer cannot identify the responsible actor or hold the judgment to account.
    good: Safety review board SRB-02 reviewed evidence E12-E19 and concluded that the claim is adequately supported.
  references:
  - source_id: RA1205
  - source_id: HSE
  tool:
    applicable_elements:
    - GSN Goal
    - GSN Justification
    - CAE Claim
    - CAE Warrant
    detection_hints:
    - Look for it was determined / has been reviewed / is considered without a named actor.
    markers:
    - kind: agentless_passive_marker
      effect: candidate
      terms:
      - it was determined
      - it was decided
      - has been reviewed
      - is considered
      - was assessed
      - it is assumed
      - has been approved
      - it was concluded
    suggested_checks:
    - id: check-active-voice-with-actor
      description: Check whether reviews, judgments, and approvals name the responsible actor. Candidate when an agentless passive marker appears and no actor is named in the same element.
    repair:
    - action: reword_element
      statement: Name the actor who performed the review, judgment, or approval.
retired_guidelines:
- id: AR.3
  title: Use context and assumptions deliberately
  retired_in: 0.8.0
  replaced_by:
  - AR.7
  - AR.6
  note: It asked for the same thing as AR.7, moving scope and dependency clauses out of claim text, and its remaining half, whether the context a claim needs is present at all, is AR.6. Cite AR.7 for placement and AR.6 for missing context.
- id: SU.9
  title: Document unstated assumptions at the point of use
  retired_in: 0.8.0
  replaced_by:
  - SU.2
  note: Merged into SU.2, which now also requires an assumption to be stated where it constrains the argument and applies to claims and context as well as assumption elements.
- id: RD.6
  title: Do not bury important limitations or hidden assumptions
  retired_in: 0.8.0
  replaced_by:
  - RD.3
  - SU.2
  note: It was the negative form of RD.3. Buried limitations are now RD.3, which keeps known limitations visible where the claim is read; hidden assumptions are SU.2.
review_profiles:
- id: claim_review
  display_name: Claim review
  description: Complete review of a selected claim (goal), covering wording, context, decomposition, evidence support, reasoning soundness, and sufficiency, in four passes.
  applies_to:
  - GSN Goal
  - CAE Claim
  guideline_ids: &id001
  - CL.1
  - CL.2
  - CL.3
  - CL.4
  - CL.5
  - CL.6
  - AR.1
  - AR.4
  - AR.5
  - AR.6
  - AR.7
  - EV.1
  - EV.3
  - EV.9
  - SU.1
  - SU.2
  - SU.4
  - SU.5
  - SU.6
  - SU.8
  - SU.11
  - LF.1
  - LF.2
  - LF.3
  - LF.4
  - LF.5
  - LF.6
  - LF.7
  - RD.1
  - RD.2
  - RD.3
  - RD.4
  - RD.5
  review_passes:
  - id: wording
    display_name: Wording
    question: Is the claim stated well, as one falsifiable and unambiguous proposition, bounded, plainly worded, and no more confident than its support?
    guideline_ids:
    - CL.1
    - CL.2
    - CL.3
    - CL.4
    - CL.5
    - CL.6
    - RD.2
    - RD.4
    - RD.5
  - id: structure
    display_name: Structure
    question: Does the claim sit correctly in the argument, in its role, its context, its level of detail, its scope across decomposition, and its path to evidence?
    guideline_ids:
    - AR.1
    - AR.4
    - AR.5
    - AR.6
    - AR.7
    - EV.1
    - EV.3
    - EV.9
  - id: sufficiency
    display_name: Sufficiency
    question: Is the claim's support good enough, and are its assumptions, limitations, and challenges visible?
    guideline_ids:
    - SU.1
    - SU.2
    - SU.4
    - SU.5
    - SU.6
    - SU.8
    - SU.11
    - RD.3
  - id: reasoning
    display_name: Reasoning
    question: Is the reasoning from support to claim sound, free of fallacies, and signposted?
    guideline_ids:
    - LF.1
    - LF.2
    - LF.3
    - LF.4
    - LF.5
    - LF.6
    - LF.7
    - RD.1
  required_data:
  - SELECTED_CLAIM
  - PARENT
  - CHILDREN
  - STRATEGY
  - DIRECT_CONTEXT
  - INHERITED_CONTEXT
  - EVIDENCE_PATH
  optional_data:
  - EVIDENCE_ITEM
  - EVIDENCE_BASIS
  - PROJECT_GLOSSARY
  - STANDARD_LINKS
  - CHANGE_HISTORY
  data_rationale:
    required:
    - id: SELECTED_CLAIM
      rationale: The selected claim is the subject of the whole review. Its wording drives CL.1, CL.2, CL.3, CL.4, CL.5, CL.6, RD.2, RD.4, and LF.6, and its scope drives every structural, evidential, and sufficiency check applied to the claim.
    - id: PARENT
      rationale: The parent claim or reasoning step is needed to check that the claim preserves inherited scope and terminology (AR.5), still supports the branch above it, and does not merely restate it (LF.1).
    - id: CHILDREN
      rationale: Child elements are the decomposition and first support step below the claim. They are required for CL.2, CL.6, AR.4, LF.1, and LF.2, and to check whether evidence is attached at the correct level.
    - id: STRATEGY
      rationale: The connecting strategy or reasoning element shows whether the inference is made explicit rather than inferred from wording (AR.1) and whether support adds independent reasoning rather than restating the claim (LF.1); its absence is itself a finding.
    - id: DIRECT_CONTEXT
      rationale: Context, assumptions, and justifications attached to the claim determine whether scope, definitions, and dependencies are externalized rather than hidden in the claim text (CL.3, AR.6, AR.7, RD.1), whether the conditions the claim depends on are stated where they constrain it (SU.2), and whether known limitations are visible where the claim is read (RD.3).
    - id: INHERITED_CONTEXT
      rationale: Scope and assumptions carried down from ancestors bound how broad or absolute the claim may be (CL.5, AR.5, RD.3) and show whether a dependency is stated where it constrains this claim or only higher up (SU.2).
    - id: EVIDENCE_PATH
      rationale: The path from the claim to its evidence is required to judge traceable support (EV.1), correct claim subject (EV.3), premise relevance (LF.2), representativeness and coverage of the claimed conditions (LF.5), unanswered unfavourable results (LF.7), and dismissed or human-derived support (SU.6, SU.8).
    optional:
    - id: EVIDENCE_ITEM
      rationale: Metadata for terminal evidence helps confirm that the traced support is precise and controlled where the claim's credibility depends on the cited artifact (EV.1, EV.3).
    - id: EVIDENCE_BASIS
      rationale: Coverage, thresholds, scenarios, and limitations help judge whether the evidence is sufficient for the claim's scope, not merely relevant (LF.5, SU.8), and expose unfavourable results the argument must answer (LF.7).
    - id: PROJECT_GLOSSARY
      rationale: Controlled definitions of terms such as safe, acceptable, nominal, or ODD resolve apparent ambiguity or overloaded wording (CL.4, AR.6).
    - id: STANDARD_LINKS
      rationale: Linked standard requirements help confirm that decomposition or scope claims that appeal to a standard are grounded rather than vague (AR.6), and that reused safety credit is tied to a real conformance basis (SU.5).
    - id: CHANGE_HISTORY
      rationale: Prior findings, review comments, and baseline state show whether the claim has been challenged, whether reused credit still applies (SU.5), and whether monitoring or open-issue commitments exist (SU.4, SU.11).
- id: strategy_review
  display_name: Strategy review
  description: Complete review of a selected strategy or reasoning step, covering whether the inference between the parent claim and its supporting claims is explicit and sound.
  applies_to:
  - GSN Strategy
  - CAE Argument
  guideline_ids: &id002
  - AR.1
  - AR.2
  - EV.9
  - SU.1
  - SU.2
  - LF.1
  required_data:
  - SELECTED_STRATEGY
  - PARENT
  - CHILDREN
  - DIRECT_CONTEXT
  optional_data:
  - INHERITED_CONTEXT
  - EVIDENCE_PATH
  - PROJECT_GLOSSARY
  - STANDARD_LINKS
  - CHANGE_HISTORY
  data_rationale:
    required:
    - id: SELECTED_STRATEGY
      rationale: The selected strategy or reasoning element is the object of review. AR.1 and AR.2 require it to make the inference rule explicit, and LF.1 requires checking that it adds independent support rather than restating the parent.
    - id: PARENT
      rationale: A strategy can only be judged against the claim it supports. AR.2 asks whether it explains how the parent is decomposed or argued, and LF.1 whether the reasoning merely restates the parent.
    - id: CHILDREN
      rationale: The supporting elements are needed to judge whether the reasoning rule actually produces this child set and whether the decomposition is complete, relevant, and non-circular (AR.2, LF.1).
    - id: DIRECT_CONTEXT
      rationale: Strategies rely on local scope, decomposition criteria, and dependencies that must be visible to decide whether the reasoning is valid for the branch (AR.1, AR.2), and whether the conditions the reasoning step depends on are stated where it uses them (SU.2).
    optional:
    - id: INHERITED_CONTEXT
      rationale: Inherited scope and assumptions help confirm that the strategy does not silently override ancestor terminology or boundaries (AR.2 consistency).
    - id: EVIDENCE_PATH
      rationale: The descendant evidence path is useful when the reasoning relies on undocumented system knowledge (EV.9) or leaves plausible challenges to the decomposition unaddressed (SU.1).
    - id: PROJECT_GLOSSARY
      rationale: The glossary resolves project-specific decomposition categories, functions, hazards, or ODD terms used in the reasoning rule.
    - id: STANDARD_LINKS
      rationale: Standard links help verify that a decomposition claiming to follow a standard or external structure is grounded rather than a vague appeal to authority (AR.2).
    - id: CHANGE_HISTORY
      rationale: Prior findings and review comments reveal whether plausible challenges to the reasoning step have already been raised and left unaddressed (SU.1).
- id: evidence_review
  display_name: Evidence review
  description: Complete review of a selected evidence item (solution), covering reviewability, control, citation precision, sufficiency, and inferential fit to the supported claim.
  applies_to:
  - GSN Solution
  - CAE Evidence
  guideline_ids: &id003
  - AR.1
  - EV.1
  - EV.2
  - EV.4
  - EV.5
  - EV.6
  - EV.7
  - EV.8
  - SU.1
  - SU.3
  - SU.6
  - SU.7
  - SU.8
  - LF.2
  - LF.5
  - LF.7
  - RD.1
  required_data:
  - SELECTED_EVIDENCE
  - EVIDENCE_ITEM
  - PARENT
  optional_data:
  - EVIDENCE_BASIS
  - DIRECT_CONTEXT
  - EVIDENCE_PATH
  - PROJECT_GLOSSARY
  - STANDARD_LINKS
  - CHANGE_HISTORY
  data_rationale:
    required:
    - id: SELECTED_EVIDENCE
      rationale: The selected solution or evidence reference is the element under review. It identifies which artifact is cited and what role it plays, which is the basis for AR.1, EV.1, and RD.1.
    - id: EVIDENCE_ITEM
      rationale: Artifact metadata such as type, owner, version, date, status, location, and cited section is required to judge whether the evidence type is reviewable and the citation precise, controlled, and stable (EV.2, EV.4, EV.7, EV.8).
    - id: PARENT
      rationale: The claim the evidence supports is required to judge relevance to the immediate claim (LF.2), a correct and traceable evidence path (EV.1), and whether the inferential link is explained (EV.6).
    optional:
    - id: EVIDENCE_BASIS
      rationale: 'Scope, coverage, thresholds, scenarios, configurations, and limitations let the review judge whether the evidence is actually adequate for the claim, not only whether the argument states a basis (LF.5, SU.7, SU.8), and expose unfavourable results the argument must answer (LF.7). Many tools cannot build it, because the data lives in test reports and evidence registers rather than in the argument. Without it every guideline is still assessed from the argument: a missing sufficiency basis is reported under EV.5, and coverage or representativeness is judged only as far as the argument itself states it.'
    - id: DIRECT_CONTEXT
      rationale: The claim's local scope and assumptions define what the evidence must cover and help detect evidence that is relevant to a neighboring or broader claim but not sufficient here (LF.2, EV.5).
    - id: EVIDENCE_PATH
      rationale: The path from claim to this evidence helps confirm traceable support and correct attachment level, especially where intermediate claims are skipped (EV.1, LF.2).
    - id: PROJECT_GLOSSARY
      rationale: The glossary resolves controlled terms used in the artifact or its acceptance criteria so the evidence is interpreted consistently.
    - id: STANDARD_LINKS
      rationale: Standard links confirm that an evidence type or acceptance criterion that appeals to a standard is grounded rather than assumed (EV.2, EV.5).
    - id: CHANGE_HISTORY
      rationale: Prior findings, review comments, and baseline state identify unstable, challenged, stale, or dismissed evidence (EV.7, EV.8, SU.1, SU.6).
- id: assumption_review
  display_name: Assumption review
  description: Complete review of a selected assumption, covering whether it is explicit, bounded, correctly placed, monitorable, and not hiding an unsupported claim.
  applies_to:
  - GSN Assumption
  - CAE Assumption
  guideline_ids: &id004
  - AR.1
  - AR.7
  - SU.2
  - SU.4
  - SU.10
  - RD.1
  required_data:
  - SELECTED_ASSUMPTION
  - DIRECT_CONTEXT
  - INHERITED_CONTEXT
  optional_data:
  - PARENT
  - CHANGE_HISTORY
  - PROJECT_GLOSSARY
  data_rationale:
    required:
    - id: SELECTED_ASSUMPTION
      rationale: The selected assumption is the dependency under review. SU.2, SU.10, and AR.7 require checking whether it is explicit, justified, bounded, monitorable, and correctly placed, and SU.4 whether it carries a re-assessment trigger where only operation can confirm it, while AR.1 and RD.1 check that it is used and signposted for its role.
    - id: DIRECT_CONTEXT
      rationale: Assumptions and justifications attached at the selected point expose the reasonableness basis, the monitoring expectation, and whether the condition should instead be context or a claim (SU.2).
    - id: INHERITED_CONTEXT
      rationale: Assumptions often propagate from ancestors, so inherited context is required to detect conflicting or over-broad inherited dependencies, and assumptions stated higher up that belong at this point (SU.2, SU.10).
    optional:
    - id: PARENT
      rationale: The scope and argument location the assumption qualifies help decide whether it is local, should be inherited more broadly, or should be converted into a claim that requires support (SU.2).
    - id: CHANGE_HISTORY
      rationale: Prior findings and baseline state show whether the assumption is monitored, has been challenged, or needs a defined re-assessment trigger (SU.2, SU.4).
    - id: PROJECT_GLOSSARY
      rationale: Controlled definitions help judge whether the assumption is specific enough to be checked, challenged, and monitored (SU.10).
- id: justification_review
  display_name: Justification review
  description: Complete review of a selected justification or warrant, covering whether it explains local rationale without replacing needed argument or evidence.
  applies_to:
  - GSN Justification
  - CAE Warrant
  - CAE Side-warrant
  - CAE Side-claim
  guideline_ids: &id005
  - AR.1
  - AR.8
  - AR.9
  - EV.5
  - SU.3
  - SU.5
  - SU.7
  - LF.3
  - LF.4
  - RD.1
  - RD.5
  required_data:
  - SELECTED_JUSTIFICATION
  - PARENT
  optional_data:
  - STRATEGY
  - EVIDENCE_PATH
  - EVIDENCE_ITEM
  - EVIDENCE_BASIS
  - CHANGE_HISTORY
  data_rationale:
    required:
    - id: SELECTED_JUSTIFICATION
      rationale: The selected justification or warrant is the object of review. AR.8, AR.9, EV.5, SU.3, SU.5, LF.3, LF.4, RD.1, and RD.5 all require inspecting what the rationale actually says and whether it names the responsible actor.
    - id: PARENT
      rationale: A justification can only be judged against the element or inference it is attached to. AR.8 asks whether it replaces evidence or argument, and AR.9 whether it explains this exact parent rather than a different issue elsewhere in the branch.
    optional:
    - id: STRATEGY
      rationale: When the justification explains a decomposition or inference choice, the strategy shows whether it is local rationale for that step or is trying to carry the argument itself (AR.8, AR.9).
    - id: EVIDENCE_PATH
      rationale: The evidence path helps detect rationale used as hidden support, arguments from ignorance, and low-risk claims resting only on simulation or uneventful operation (AR.8, LF.3, SU.7).
    - id: EVIDENCE_ITEM
      rationale: When the justification cites expert review, prior practice, or proven-in-use evidence, artifact metadata shows whether the cited basis is controlled and reviewable rather than unsupported opinion (SU.3, SU.5).
    - id: EVIDENCE_BASIS
      rationale: Coverage, thresholds, and comparison basis help judge sufficiency appeals and unjustified comparisons or distinctions (EV.5, LF.4, SU.7).
    - id: CHANGE_HISTORY
      rationale: Prior review comments, unresolved findings, and baseline shifts show whether the justification has been challenged, whether agency is clear (RD.5), and whether reused safety credit still applies (SU.5).
- id: context_review
  display_name: Context review
  description: Complete review of a selected context element, covering whether it gives the claim it qualifies bounded, consistent scope and definitions, and whether it carries the claim's known limitations.
  applies_to:
  - GSN Context
  - CAE Context
  guideline_ids: &id006
  - CL.5
  - AR.1
  - AR.5
  - AR.6
  - AR.7
  - RD.1
  - RD.3
  required_data:
  - SELECTED_CONTEXT
  - PARENT
  - INHERITED_CONTEXT
  optional_data:
  - PROJECT_GLOSSARY
  - STANDARD_LINKS
  data_rationale:
    required:
    - id: SELECTED_CONTEXT
      rationale: The selected context element is the object of review. AR.1 and RD.1 check that it is used and signposted as context, CL.5 that its evaluative terms are bounded, AR.6 that it supplies the scope and definitions the claim needs, and RD.3 that it carries the claim's known limitations.
    - id: PARENT
      rationale: The claim or element the context qualifies is required to judge whether the context is sufficient and relevant for interpreting that claim (AR.6), whether scope and qualifiers have been moved out of the claim text into it (AR.7), and whether the claim's known limitations are visible where it is read (RD.3).
    - id: INHERITED_CONTEXT
      rationale: Ancestor context is required to check whether this context restates, silently narrows, redefines, or contradicts what the branch already inherits (AR.5).
    optional:
    - id: PROJECT_GLOSSARY
      rationale: Controlled definitions confirm that terms introduced or relied on by the context are bounded and used consistently across the branch (CL.5, AR.5, AR.6).
    - id: STANDARD_LINKS
      rationale: When the context cites external standards or operating constraints, standard links help verify that the reference is relevant and defines what the context says it does (AR.6).
- id: challenge_review
  display_name: Challenge review
  description: Complete review of a selected counter claim or defeater, covering whether the challenge is a clear, specific proposition used as a challenge, and whether it is carried to a visible resolution.
  applies_to:
  - GSN Counter Claim
  - CAE Defeater
  guideline_ids: &id007
  - CL.1
  - CL.4
  - AR.1
  - SU.11
  required_data:
  - SELECTED_CHALLENGE
  - PARENT
  optional_data:
  - CHILDREN
  - DIRECT_CONTEXT
  - CHANGE_HISTORY
  data_rationale:
    required:
    - id: SELECTED_CHALLENGE
      rationale: The selected counter claim or defeater is the challenge under review. CL.1 and CL.4 require it to be a specific proposition that competent readers would take the same way, AR.1 that it states a challenge rather than a note, a claim, or its own resolution, and SU.11 that it is an explicit element rather than something left in review comments or reviewer intuition.
    - id: PARENT
      rationale: The claim, reasoning step, or evidence being challenged is required to judge whether the challenge is relevant to its target and whether the branch has been updated to resolve it (SU.11).
    optional:
    - id: CHILDREN
      rationale: Supporting elements added in response show whether the challenge was resolved by added evidence, a narrowed claim, or new assumptions and monitoring (SU.11).
    - id: DIRECT_CONTEXT
      rationale: Context and assumptions attached to the challenge or its target help judge whether the challenge is in scope and how its resolution constrains the affected claim (SU.11).
    - id: CHANGE_HISTORY
      rationale: Review comments, prior findings, and proposal history show whether the challenge was rejected, sustained, or left as a visible and traceable open issue (SU.11).
selectable_elements:
- element: GSN Goal
  notation: GSN
  element_role: claim
  basis: GSN Community Standard v3 core element (Goal).
- element: GSN Strategy
  notation: GSN
  element_role: strategy
  basis: GSN Community Standard v3 core element (Strategy).
- element: GSN Solution
  notation: GSN
  element_role: evidence
  basis: GSN Community Standard v3 core element (Solution).
- element: GSN Context
  notation: GSN
  element_role: context
  basis: GSN Community Standard v3 core element (Context).
- element: GSN Assumption
  notation: GSN
  element_role: assumption
  basis: GSN Community Standard v3 core element (Assumption).
- element: GSN Justification
  notation: GSN
  element_role: justification
  basis: GSN Community Standard v3 core element (Justification).
- element: GSN Counter Claim
  notation: GSN
  element_role: challenge
  basis: Dialectic extension used for explicit challenges; referenced by SU.11.
- element: CAE Claim
  notation: CAE
  element_role: claim
  basis: Claims-Arguments-Evidence core element (Claim).
- element: CAE Argument
  notation: CAE
  element_role: strategy
  basis: Claims-Arguments-Evidence core element (Argument / reasoning).
- element: CAE Evidence
  notation: CAE
  element_role: evidence
  basis: Claims-Arguments-Evidence core element (Evidence).
- element: CAE Context
  notation: CAE
  element_role: context
  basis: Claims-Arguments-Evidence contextual element (Context).
- element: CAE Assumption
  notation: CAE
  element_role: assumption
  basis: Claims-Arguments-Evidence contextual element (Assumption).
- element: CAE Warrant
  notation: CAE
  element_role: justification
  basis: CAE building block for the reasoning warrant / rationale; the CAE analogue of a GSN Justification.
- element: CAE Side-warrant
  notation: CAE
  element_role: justification
  basis: CAE building block that backs a warrant with additional rationale.
- element: CAE Side-claim
  notation: CAE
  element_role: justification
  basis: CAE building block that supports a warrant with a subsidiary claim.
- element: CAE Defeater
  notation: CAE
  element_role: challenge
  basis: CAE-with-defeaters element used for explicit challenges; the CAE analogue of a GSN Counter Claim.
review_pass_instruction: 'This request is one pass of a review that is split into several passes. The question for this pass is: {question} Review the selected element only against the guidelines in this request, and do not report a finding under any other guideline; the other passes cover them. Where a note in this request says to cite a guideline that is not in this request for some defect, that defect is not a finding in this pass: another pass reports it if this review applies that guideline, and otherwise it is outside this review.'
review_pass_merge: A finding counts only for the pass that carries its guideline. A finding that a pass cites under a guideline outside that pass is discarded, and a tool may record that it discarded it but does not report it as a finding. A review in which any pass did not complete is incomplete, not a review that found nothing in that pass.

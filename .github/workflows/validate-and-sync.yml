name: Validate and check generated outputs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate authored content and generated outputs
        run: python scripts/validate.py

      - name: Build distribution files
        run: python scripts/build_dist.py

      - name: Build site page
        run: python scripts/build_site.py

      - name: Build coverage reports
        run: python scripts/check_coverage.py

      - name: Fail if generated files are out of sync
        run: |
          untracked_files="$(git ls-files --others --exclude-standard)"
          if ! git diff --exit-code || [ -n "$untracked_files" ]; then
            if [ -n "$untracked_files" ]; then
              echo "Untracked files detected:"
              printf '%s\n' "$untracked_files"
            fi
            echo ""
            echo "::error::Generated files are out of sync with authored content."
            echo "Run: python scripts/build_dist.py, python scripts/build_site.py, and python scripts/check_coverage.py, then commit the result."
            exit 1
          fi
